<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>REMEDIATE: Cozy Starlight Escape Room</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;width:100vw;overflow:hidden;background:#000;color:#f1f5f9;display:flex;justify-content:center;align-items:center;font-family:monospace}
button{font-family:inherit}
#hotspots,.hud{user-select:none}
.hidden{display:none!important}
.pix{font-family:'Press Start 2P',monospace}
.dig{font-family:'VT323',monospace}
#room{position:relative;width:100%;height:100%;max-width:1920px;max-height:1080px;margin:0 auto;overflow:hidden;background:#020617;display:flex;align-items:center;justify-content:center;container-type:size}
/* image and hotspots share one 16:9 box, so the icons stay on their objects at any window size */
#starfield-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stage{position:relative;flex:none;width:min(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9}
#stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.box{border:3px solid #6366f1;box-shadow:0 0 10px rgba(99,102,241,.4),inset 0 0 10px rgba(99,102,241,.2);backdrop-filter:blur(8px);background:rgba(10,15,30,.86)}
.btn{font:12px 'Press Start 2P',monospace;padding:12px 16px;border-radius:4px;cursor:pointer;border:2px solid #a855f7;box-shadow:0 4px 0 #6b21a8;background:#6b21a8;color:#fde047;transition:all .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b21a8}
.btn.sec{border-color:#64748b;box-shadow:0 4px 0 #334155;background:#1e293b;color:#e2e8f0}
.btn.dan{border-color:#f87171;box-shadow:0 4px 0 #7f1d1d;background:#7f1d1d;color:#fee2e2}
button:focus-visible,input:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}

/* hotspots */
#hotspots{position:absolute;inset:0;z-index:10}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;padding:0}
.hs .wrap{position:relative;display:flex;align-items:center;justify-content:center;width:34px;height:34px}
.hs .ping{position:absolute;width:100%;height:100%;border-radius:50%;background:var(--ping);animation:pulse 2.2s infinite ease-in-out}
.hs .core{position:relative;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--core);border:1px solid var(--bd);font-size:10px;color:#fff;font-weight:bold;box-shadow:0 0 10px var(--ping)}
.tag{opacity:0;transform:translateY(4px);transition:all .2s;pointer-events:none;white-space:nowrap;margin-top:4px;padding:4px 8px;background:rgba(15,23,42,.9);border:1px solid var(--tagb);border-radius:4px;font:10px 'Press Start 2P',monospace;color:var(--tag)}
.hs:hover .tag,.hs:focus-visible .tag,.labels-on .tag{opacity:1;transform:none}
.cyan{--ping:rgba(34,211,238,.4);--core:rgba(6,182,212,.9);--bd:#a5f3fc;--tag:#67e8f9;--tagb:rgba(34,211,238,.8)}
.amber{--ping:rgba(251,191,36,.4);--core:rgba(245,158,11,.9);--bd:#fde68a;--tag:#fcd34d;--tagb:rgba(251,191,36,.8)}
.emerald{--ping:rgba(52,211,153,.4);--core:rgba(16,185,129,.9);--bd:#a7f3d0;--tag:#6ee7b7;--tagb:rgba(52,211,153,.8)}
.rose{--ping:rgba(244,63,94,.4);--core:rgba(225,29,72,.9);--bd:#fda4af;--tag:#fda4af;--tagb:rgba(244,63,94,.8)}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}50%{transform:scale(1.25);opacity:.4}100%{transform:scale(.85);opacity:.9}}
@keyframes ping{75%,100%{transform:scale(2);opacity:0}}

/* HUD */
.hud{position:absolute;z-index:20}
#progress{top:24px;left:24px;padding:12px 20px;border-radius:6px;min-width:280px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.row .l{font-size:10px;color:#a5b4fc;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;animation:ping 1s cubic-bezier(0,0,.2,1) infinite}
#prog-text{font-size:11px;color:#fcd34d;font-weight:bold}
#nodes{display:flex;gap:6px;margin:8px 0}
.node{height:10px;width:20px;border-radius:2px;border:1px solid #475569;background:rgba(51,65,85,.8)}
.node.solved{background:#22d3ee;border-color:#a5f3fc;box-shadow:0 0 6px #22d3ee}
.node.active{background:rgba(251,191,36,.8);border-color:#fcd34d;animation:pulse 2.2s infinite}
.bar{width:100%;height:6px;background:#0f172a;border-radius:99px;overflow:hidden;border:1px solid rgba(49,46,129,.6);margin-top:4px}
#prog-bar{height:100%;width:0;border-radius:99px;background:linear-gradient(to right,#6366f1,#22d3ee,#34d399);transition:width .5s}
#timer-box{top:24px;left:50%;transform:translateX(-50%);padding:10px 32px;border-radius:8px;display:flex;flex-direction:column;align-items:center;border:2px solid rgba(34,211,238,.8);box-shadow:0 0 20px rgba(34,211,238,.35)}
#timer-label{font-size:9px;color:#67e8f9;letter-spacing:.1em;margin-bottom:2px}
#timer{font-size:clamp(36px,4.5vw,60px);letter-spacing:.1em;line-height:1;color:#22d3ee;text-shadow:0 0 12px rgba(34,211,238,.9)}
#controls{top:24px;right:24px;display:flex;gap:8px}
.hbtn{font:10px 'Press Start 2P',monospace;color:#cbd5e1;padding:8px 12px;border-radius:4px;cursor:pointer;transition:color .15s,background .15s}
.hbtn:hover{background:rgba(30,27,75,.8);color:#67e8f9}
#btn-menu:hover{color:#fcd34d}
#hint-wrap{bottom:24px;left:24px}
#btn-hint{background:rgba(88,28,135,.9);padding:14px 20px;border-radius:6px;display:flex;align-items:center;gap:8px;letter-spacing:.05em}
#inv{bottom:24px;right:24px;padding:10px 16px;border-radius:6px;display:flex;align-items:center;gap:12px}
#inv .lbl{font-size:10px;color:#a5b4fc;letter-spacing:.05em;margin-right:4px}
.slot{width:44px;height:44px;background:rgba(2,6,23,.6);border:2px dashed rgba(51,65,85,.8);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:24px}
.slot span{color:#475569;font-size:9px}
.slot.filled{border-style:solid;border-color:#fbbf24}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;white-space:nowrap;opacity:0;pointer-events:none;background:rgba(15,23,42,.95);border:1px solid #67e8f9;color:#a5f3fc;font:10px 'Press Start 2P',monospace;padding:5px 8px;border-radius:4px;transition:opacity .15s}
[data-tip].tip-top::after{top:auto;bottom:calc(100% + 8px);right:auto;left:0}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1}

/* toast + dialogs */
#toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:30;padding:12px 20px;border-radius:6px;font:12px 'Press Start 2P',monospace;line-height:1.6;color:#a5f3fc;text-align:center;max-width:70%}
#toast.warn{color:#fca5a5;border-color:#ef4444}
#modal{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center}
.dialog{width:90%;max-width:448px;max-height:92%;overflow-y:auto;padding:24px;border-radius:8px}
.dialog.wide{max-width:680px}
.dialog h2{font:14px/1.6 'Press Start 2P',monospace;color:#fcd34d;margin:0 0 16px}
.dbody{font:24px/1.25 'VT323',monospace;color:#e2e8f0}
.dbody p{margin:0 0 10px}
.dbody label{display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer}
.dbody input[type=checkbox]{width:20px;height:20px;accent-color:#a855f7}
#da{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.code{margin:0 0 8px;padding:10px 14px;background:#020617;border:1px solid #334155;border-radius:4px;font:22px/1.2 'VT323',monospace;color:#a5f3fc;white-space:pre;overflow-x:auto;user-select:text}
.err{color:#fca5a5}
.opt{display:block;width:100%;text-align:left;margin-top:6px;padding:6px 10px;background:#1e1b4b;border:2px solid #6366f1;border-radius:4px;color:#e2e8f0;font:22px 'VT323',monospace;cursor:pointer}
.opt:hover:not(:disabled){border-color:#22d3ee}
.opt.bad{border-color:#ef4444;color:#fca5a5;opacity:.7}
.opt.good{border-color:#4ade80;color:#bbf7d0}
.fb{margin:10px 0 0;min-height:1.2em}
.fb.ok{color:#86efac}.fb.no{color:#fca5a5}
.orange{--ping:rgba(249,115,22,.55);--core:rgba(234,88,12,.95);--bd:#fed7aa;--tag:#fdba74;--tagb:rgba(251,146,60,.9)}
.violet{--ping:rgba(167,139,250,.4);--core:rgba(139,92,246,.9);--bd:#ddd6fe;--tag:#c4b5fd;--tagb:rgba(167,139,250,.8)}
.exp{color:#fcd34d}
.editor{display:block;width:100%;background:#020617;border:2px solid #334155;border-radius:4px;padding:10px 14px;font:22px/1.2 'VT323',monospace;color:#a5f3fc;resize:none;user-select:text;tab-size:4;white-space:pre;overflow:auto}
.editor:focus{border-color:#22d3ee;outline:none}
.con{margin-top:8px;min-height:64px;padding:8px 14px;background:#0b1120;border:1px dashed #475569;border-radius:4px;font:22px/1.2 'VT323',monospace;white-space:pre-wrap;color:#e2e8f0;user-select:text}
.con .ok{color:#86efac}
.btn:disabled{opacity:.5;cursor:wait}


/* ===== Submission-form window (puzzle pop-up) ===== */
#modal2{position:absolute;inset:0;z-index:45;background:rgba(4,6,16,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.sf{--bg:#060814;--panel:#0c1024;--panel-2:#0a0e1f;--border:#1c2440;--cyan:#4fe0ff;--violet:#9b8cf5;--pink:#ff5a9d;--amber:#ffc857;--ink:#cfd6f0;--dim:#6a7196;
font-family:'Space Mono',monospace;color:var(--ink);user-select:text;position:relative;width:100%;overflow:visible;transform-origin:center center;padding:14px 22px 16px;background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--border);border-radius:4px}
.sf.main{max-width:1040px}.sf.small{max-width:480px}
.sf::before,.sf::after,.sf .tbl,.sf .tbr{content:'';position:absolute;width:7px;height:7px;background:var(--cyan)}
.sf::before{top:-4px;left:-4px}.sf::after{top:-4px;right:-4px}.sf .tbl{bottom:-4px;left:-4px}.sf .tbr{bottom:-4px;right:-4px}
.sf.pink::before,.sf.pink::after,.sf.pink .tbl,.sf.pink .tbr{background:var(--pink)}
.sf.violet::before,.sf.violet::after,.sf.violet .tbl,.sf.violet .tbr{background:var(--violet)}
.sf .sec{position:relative;border:1px solid var(--border);border-radius:4px;background:linear-gradient(180deg,var(--panel),var(--panel-2));padding:16px 20px;margin-bottom:14px}
.sf .sec.pk{border-color:rgba(255,90,157,.35)}.sf .sec.vi{border-color:rgba(155,140,245,.35);margin-bottom:0}
.sf .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sf .title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.03em;color:#fff}
.sf .sq{width:9px;height:9px;flex:none}.sf .sq.cyan{background:var(--cyan)}.sf .sq.pink{background:var(--pink)}.sf .sq.violet{background:var(--violet)}
.sf .badge{font-size:10px;font-weight:700;letter-spacing:.05em;border:1px solid;border-radius:5px;padding:4px 10px;white-space:nowrap}
.sf .badge.pink{color:var(--pink);border-color:rgba(255,90,157,.4);background:rgba(255,90,157,.08)}
.sf .badge.violet{color:var(--violet);border-color:rgba(155,140,245,.4);background:rgba(155,140,245,.08)}
.sf .badge.cyan{color:var(--cyan);border-color:rgba(79,224,255,.4);background:rgba(79,224,255,.08)}
.sf .eyebrow{font-size:10px;letter-spacing:.1em;color:var(--dim);margin-bottom:12px}
.sf .mission{background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--cyan);padding:11px 15px;font-size:13px;line-height:1.6;margin-bottom:12px}
.sf .mission.plain{margin-bottom:0}.sf .mission b{color:var(--amber)}.sf .mission u{color:var(--cyan);text-decoration:underline}.sf .mission .ex{color:var(--amber)}
.sf .cc{background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--pink);padding:12px 16px}
.sf .tagrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sf .ctag{font-size:10px;font-weight:700;color:var(--pink);border:1px solid rgba(255,90,157,.4);border-radius:4px;padding:3px 8px}
.sf .status{font-size:10px;color:var(--dim)}
.sf .msg{font-size:12.5px;line-height:1.6;white-space:pre-wrap}
.sf .sfcode{font-size:13px;line-height:1.7;white-space:pre;overflow:hidden}
.sf .kw{color:var(--violet)}.sf .fn{color:var(--cyan)}.sf .cm{color:var(--dim)}.sf .st{color:#7ee0b0}.sf .bug{color:var(--pink);font-weight:700}
.sf .meta{font-size:10px;color:var(--dim);margin-bottom:10px}
.sf textarea{display:block;width:100%;min-height:90px;background:var(--panel-2);border:1px solid var(--border);color:var(--ink);font-family:'Space Mono',monospace;font-size:13px;line-height:1.7;padding:10px 14px;resize:none;white-space:pre;overflow:hidden;tab-size:4;border-radius:0}
.sf textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(155,140,245,.15)}
.sf .tip{font-size:10.5px;color:var(--dim);margin-top:8px}
.sf .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.sf .hints{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--amber);cursor:pointer;background:rgba(255,200,87,.08);border:1px solid rgba(255,200,87,.45);border-radius:4px;font-family:inherit;padding:9px 14px;text-align:left}
.sf .hints:hover:not(:disabled){background:rgba(255,200,87,.16)}
.sf .hints.none{color:var(--dim);border-color:var(--border);background:transparent}
.sf .hints b{color:#fff}
.sf .btns{display:flex;gap:10px;flex-wrap:wrap}
.sf .sb{font-family:'Space Mono',monospace;font-weight:700;font-size:12px;letter-spacing:.04em;padding:10px 18px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:8px}
.sf .sb.ghost{background:transparent;border:1px solid var(--violet);color:var(--violet)}
.sf .sb.ghost:hover:not(:disabled){background:rgba(155,140,245,.12)}
.sf .sb.go{background:var(--cyan);border:none;color:#03202b;box-shadow:0 0 18px rgba(79,224,255,.4)}
.sf .sb.go:hover:not(:disabled){filter:brightness(1.1)}
.sf .sb:disabled{opacity:.5;cursor:wait}
.sf button:focus-visible,.sf textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sf .topbar{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px;margin:0 0 14px}
.sf .tp{position:relative;border:1px solid var(--border);border-radius:4px;background:linear-gradient(180deg,var(--panel),var(--panel-2));padding:10px 16px}
.sf .tp::before,.sf .tp::after,.sf .tp .tbl,.sf .tp .tbr{content:'';position:absolute;width:5px;height:5px;background:var(--cyan)}
.sf .tp::before{top:-3px;left:-3px}.sf .tp::after{top:-3px;right:-3px}.sf .tp .tbl{bottom:-3px;left:-3px}.sf .tp .tbr{bottom:-3px;right:-3px}
.sf .tp .lb{font-size:9px;letter-spacing:.1em;color:var(--dim)}
.sf .tp .vl{font-size:14px;font-weight:700;margin-top:6px;color:var(--cyan)}
.sf .tp.mid{text-align:center}.sf .tp.mid .vl{font-family:'Press Start 2P',monospace;font-size:20px;color:var(--pink);text-shadow:0 0 16px rgba(255,90,157,.55);margin-top:8px}
.sf .tp.rt{text-align:right}.sf .tp.rt .vl{color:var(--amber)}
.sf .dots{display:inline-flex;gap:5px;margin-top:6px}.sf .dots i{width:7px;height:7px;background:#232a4a}.sf .dots i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.sf .xbtn{background:none;border:0;color:var(--dim);font:700 12px 'Space Mono',monospace;cursor:pointer;padding:0}
.sf .xbtn:hover{color:var(--violet)}
.sf .xbtn.close{position:absolute;top:0;left:calc(100% + 14px);width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:0;font-size:22px;line-height:1;color:var(--ink)}
.sf .xbtn.close:hover{border-color:var(--pink);color:var(--pink)}
#modal.pz{background:rgba(4,6,16,.94);padding:16px 76px}
@media(max-width:639px){.sf .topbar{grid-template-columns:1fr 1fr}.sf .tp.mid{display:none}}
@media(max-width:639px){.sf{padding:14px}.sf .sec{padding:12px}.sf .title{font-size:11px}}

@media(max-width:639px){
#progress{top:16px;left:16px;padding:10px 14px;min-width:240px}
#timer-box{top:16px;padding:8px 24px}
#controls{top:16px;right:16px}
#hint-wrap{bottom:16px;left:16px}
#inv{bottom:16px;right:16px}
#inv .lbl{display:none}
}
@media(prefers-reduced-motion:reduce){.ping,.node.active,.dot{animation:none}}
</style>
</head>
<body>
<main id="room">
<canvas id="starfield-canvas" aria-hidden="true"></canvas>
<div id="stage">
<img alt="Cozy starlit room with a window, refrigerator, kettle on the dining table and exit door" src="room_door_closed_no_girl.png"/>

<div id="hotspots">
<button class="hs orange" data-hs="window" aria-label="Window puzzle" style="top:16%;left:49%"><div class="wrap"><span class="ping"></span><span class="core">✦</span></div><div id="tag-window" class="tag"></div></button>
<button class="hs amber" data-hs="fridge" aria-label="Refrigerator puzzle" style="top:43%;left:43.5%"><div class="wrap"><span class="ping"></span><span class="core">🔒</span></div><div id="tag-fridge" class="tag"></div></button>
<button class="hs emerald" data-hs="kettle" aria-label="Kettle puzzle" style="top:65%;left:46.5%"><div class="wrap"><span class="ping"></span><span class="core">☕</span></div><div id="tag-kettle" class="tag"></div></button>
<button class="hs violet" data-hs="clock" aria-label="Wall clock puzzle" style="top:26%;left:39.5%"><div class="wrap"><span class="ping"></span><span class="core">🕰️</span></div><div id="tag-clock" class="tag"></div></button>
<button class="hs rose" data-hs="door" aria-label="Exit door" style="top:47%;left:80%"><div class="wrap"><span class="ping"></span><span class="core">🔑</span></div><div id="tag-door" class="tag"></div></button>
</div>
</div>

<header id="progress" class="hud box">
<div class="row"><div class="l pix"><span class="dot"></span>ROOM PROGRESS</div><span id="prog-text" class="pix">0 / 4 SOLVED</span></div>
<div id="nodes"><span class="node" title="Window"></span><span class="node" title="Kettle"></span><span class="node" title="Refrigerator"></span><span class="node" title="Wall Clock"></span></div>
<div class="bar"><div id="prog-bar"></div></div>
</header>

<div id="timer-box" class="hud box" role="timer">
<div id="timer-label" class="pix">TIME ELAPSED</div>
<span id="timer" class="dig">00:00</span>
</div>

<aside id="controls" class="hud">
<button id="btn-menu" class="hbtn box" data-tip="Open game menu">⚙️ MENU</button>
</aside>

<div id="hint-wrap" class="hud">
<button id="btn-hint" class="btn tip-top" data-tip="Ask for a hint (uses 1 hint)"><span style="font-size:18px">💡</span><span id="hint-label">HINTS [3/3 REMAINING]</span></button>
</div>

<footer id="inv" class="hud box">
<span class="lbl pix">INVENTORY:</span>
<div class="slot"><span class="pix">+</span></div><div class="slot"><span class="pix">+</span></div><div class="slot"><span class="pix">+</span></div><div class="slot"><span class="pix">+</span></div>
</footer>

<div id="toast" class="box hidden" role="status" aria-live="polite"></div>
<div id="modal" class="hidden"></div>
<div id="modal2" class="hidden"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="starfield.js"></script>
<script src="settings.js"></script>
<script src="pyrunner.js"></script>
<script src="puzzles.js"></script>
<script src="adaptive.js"></script>
<script src="integrity.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
sessionStorage.removeItem('lastSessionId');

/* ---------- Timer (counts up from 00:00) ---------- */
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
let startTs = Date.now();
let elapsed = 0;
function tick(){ if (over) return; elapsed = Math.floor((Date.now() - startTs) / 1000); $('timer').textContent = fmt(elapsed); const t = $('sf-time'); if (t) t.textContent = fmt(elapsed); }

/* ---------- Saving: the session row is made at start, each attempt is saved as it happens ---------- */

function ensureSession(){

if (!sessionMaking) sessionMaking = (async () => {
try {
const { data, error } = await db.from('game_sessions').insert({ result:'in_progress', solved_count:0, hints_used:0, elapsed_sec:0, level: roomLevel, puzzle_ids: roomPuzzleIds }).select('id').single();
if (error) throw error;

async function saveAll(result){
let ok = true;
try {
const sid = await ensureSession();
if (!sid) throw new Error('no session');
if (attempts.length) {
const batch = attempts.splice(0);
const r = await db.from('submissions').insert(batch.map(a => ({ ...a, session_id: sid })));
if (r.error) { attempts.unshift(...batch); throw r.error; }
}
// anti-cheat log: saved on the side. If migration-03.sql was not run yet this must never break saving the game
if (integrityQueue.length && integrityFails < 3) {
const ev = integrityQueue.splice(0);
const r = await db.from('integrity_events').insert(ev.map(e => ({ ...e, session_id: sid })));
if (r.error) { integrityFails++; console.warn('integrity_events not saved:', r.error.message); if (integrityFails < 3) integrityQueue.unshift(...ev); }
}
const u = await db.from('game_sessions').update({ ...(result ? { result, next_level: roomAdaptive ? nextLevel({ level: roomLevel, result, solved_count: count(), hints_used: 3 - hints, elapsed_sec: timeCols().elapsed_sec }, allAttempts) : roomLevel } : {}), solved_count: count(), hints_used: 3 - hints, ...timeCols() }).eq('id', sid);

} catch (e) {

}
return ok;
}
// saves run one after another, so the final result is never overwritten by an older save
function queueSave(result){ return (saveChain = saveChain.then(() => saveAll(result))); }

/* ---------- The 4 spots in the room. Each spot gets one puzzle from the bank (puzzles.js) ---------- */
const SPOTS = {
window: { icon:'✦', name:'Window', reward:['🌠','Star Map'] },
fridge: { icon:'🔒', name:'Refrigerator', reward:['🗝️','Silver Key'] },
kettle: { icon:'☕', name:'Kettle', reward:['📜','Cipher Note'] },
clock: { icon:'🕰️', name:'Wall Clock', reward:['⚙️','Clock Gear'] }
};
const P = {}, META = {};   // filled by buildRoom(): spot -> puzzle
let roomReady = false, roomLevel = 'BEGINNER', roomAdaptive = true, roomPuzzleIds = [];
// Each object is tied to one category (SPOT_CATEGORY, from puzzles.js) and every puzzle of that category
// is themed on that object. buildRoom() assigns puzzles to spots by category match.
function buildRoom(picked){
const used = new Set(), assigned = {};
// pass 1: exact category match
PUZ.forEach(k => {
const want = SPOT_CATEGORY[k];
const match = picked.find(p => p.category === want && !used.has(p.id));
if (match) { assigned[k] = match; used.add(match.id); }
});
// pass 2: fill unmatched spots with leftovers (keeps game working when bank is small)
const leftovers = picked.filter(p => !used.has(p.id));
let li = 0;
PUZ.forEach(k => { if (!assigned[k]) assigned[k] = leftovers[li++]; });
PUZ.forEach(k => {
const p = assigned[k];
P[k] = { ...SPOTS[k], ...p, pid: p.id };
META[k] = { file:p.file, status:p.status, badge:p.badge, bug:p.bug };
});
roomPuzzleIds = PUZ.map(k => assigned[k].id);
}
// Level + puzzles for this game: the level carries over from the last finished game (adaptive.js rules),
// categories the player keeps missing come back. Control group (profiles.adaptive = false): fixed start level, no targeting.
async function setupRoom(user){
let level = 'BEGINNER', weak = [], lastIds = [];
try {
const prof = await getProfile(user.id);
if (prof) { if (LEVELS.includes(prof.difficulty)) level = prof.difficulty; roomAdaptive = prof.adaptive !== false; }
const r1 = await db.from('game_sessions').select('level,next_level,puzzle_ids').order('created_at', { ascending:false }).limit(10);
const rows = r1.data || [];
const lastRoom = rows.find(x => x.puzzle_ids); if (lastRoom) lastIds = lastRoom.puzzle_ids;
if (roomAdaptive) {
// only finished games write next_level; skip any in_progress row
const carried = rows.find(x => x.next_level); if (carried) level = carried.next_level;
const r2 = await db.from('submissions').select('category,is_correct,kind').eq('kind', 'submit').not('category', 'is', null).order('id', { ascending:false }).limit(RULES.historyAttempts);
weak = weakCategories(r2.data || []);
}
} catch (e) { console.error(e); }   // offline: start at the safe default, the game still works
roomLevel = level;
buildRoom(pickRoom({ level, weak: roomAdaptive ? weak : [], lastIds }));
roomReady = true; renderAll();
if (roomAdaptive) toast('Room level: ' + level.charAt(0) + level.slice(1).toLowerCase() + (weak.length ? ' · focus: ' + weak.slice(0, RULES.weakSlots).map(w => w[0]).join(', ') : ''));
}

const MAX_CHARS = 500;
const KW = /(#.*$)|("[^"]*"|'[^']*')|\b(def|return|for|in|if|else|elif|while|import)\b|\b([A-Za-z_]\w*)(?=\()/;

const m = KW.exec(r);

r = r.slice(m.index + m[0].length);
}
return o;
}

// Hidden checks, so a correct fix written a different way still passes but a hardcoded answer does not:
// 1) same code on different data, 2) call the function with a new input, 3) the result must come from a real call.
async function hardcoded(p, code){
if (p.variant) {
if (!new RegExp(p.variant.re).test(code)) return { bad:true };   // the original data was deleted
const d = await runPy(applyVariant(code, p.variant));
if (d.sys) return { sys:d.sys };
if (d.err || (d.out || '').trim() !== p.variant.expect) return { bad:true };
}
for (const pr of (p.probes || [])) {
const f = pr.fn;
const d = await runPy(code + `\nimport inspect as _i\n_n = len(_i.signature(${f}).parameters)\nprint("@@PROBE@@" + str(${f}(*${pyLiteral(pr.args)}[:_n])))`);
if (d.sys) return { sys:d.sys };
const got = (d.out || '').split('@@PROBE@@')[1];
if (d.err || got === undefined || got.trim() !== pr.expect) return { bad:true };
}
if (p.needCall) {
const d = await runPy(`import ast
src = ${JSON.stringify(code)}
tree = ast.parse(src)
par = {}
for n in ast.walk(tree):
    for c in ast.iter_child_nodes(n): par[c] = n
ok = any(isinstance(n, ast.Call) and getattr(n.func, 'id', None) == ${JSON.stringify(p.needCall)} and not isinstance(par.get(n), ast.Expr) for n in ast.walk(tree))
print("@@AST@@" + ("ok" if ok else "bad"))`);
if (d.sys) return { sys:d.sys };
if (d.err || !(d.out || '').includes('@@AST@@ok')) return { bad:true };
}
return {};
}
// Runs the code in Python and checks it against the puzzle. kind = 'run' (test button) or 'submit'.
// Every real attempt is saved. Python failing to load is NOT an attempt and is never saved.
async function evaluate(id, code, kind){
const p = P[id];
const d = await runPy(code);
if (d.sys) return { ok:false, sys:true, msg:esc(d.sys) };
const out = (d.out || '').trim();
let tag = null, msg = '';
if (d.err) {
const last = cleanErr(d.err).trim().split('\n').pop();
const m = last.match(/^(\w*Error)/);
tag = !m ? 'Runtime Error' : m[1] === 'TimeoutError' ? 'Infinite Loop' : m[1];
msg = 'Python says: ' + esc(last);
} else if (out !== p.expect) { tag = 'Wrong Output'; msg = `It ran, but printed "${esc(out)}" instead of "${esc(p.expect)}".`; }
else {
const h = await hardcoded(p, code);
if (h.sys) return { ok:false, sys:true, msg:esc(h.sys) };
if (h.bad) { tag = 'Hardcoded Answer'; msg = 'The output matches, but the fix only works for this one case. Keep the original code and fix the actual bug.'; }
}
const row = { puzzle: p.title, kind, code: code.slice(0, 2000), is_correct: !tag, mistake_tag: tag,
puzzle_id: p.pid, category: p.category, difficulty: p.level, attempt_no: nTry[id] = (nTry[id] || 0) + 1,
hints_used: hintTier[id] || 0, elapsed_ms: Math.round(spentMs(id)), mistake_category: tag ? categoryOfTag(tag) : null };
attempts.push(row); allAttempts.push(row);
queueSave();
return { ok: !tag, tag, msg };
}
function win(){
guard.stop(); over = 'won'; elapsed = Math.floor((Date.now() - startTs) / 1000); $('timer').textContent = fmt(elapsed);
const savedP = queueSave('won');
dlg({ icon:'🎉', title:'Door unlocked!', body:`You used all 4 items to unlock the door and escaped in <b>${fmt(elapsed)}</b>.`,
actions:[{ l:'Continue', f:async () => { await savedP; location.href = 'test-summary.html'; } }] });
}
$('hotspots').addEventListener('click', e => {
const b = e.target.closest('[data-hs]');
if (!b) return;
try { act(b.dataset.hs); } catch (err) { console.error(err); toast('Error: ' + err.message, true); }
});

/* ---------- Hints: one pool of 3 for the whole room; every puzzle has its own hint steps ---------- */
const hintsOn = () => RemediateSettings.get().hints;
const hintsLeftFor = k => P[k].hint.length - (hintTier[k] || 0);   // steps this puzzle still has
// the HUD button hints the puzzle the player opened last (if still unsolved), else the first unsolved one
const hudTarget = () => lastOpen && !got.includes(lastOpen) ? lastOpen : PUZ.find(x => !got.includes(x));
function takeHint(k){
const t = hintTier[k] || 0; hintTier[k] = t + 1; hints--;
renderHints(); queueSave();
return P[k].hint[t];
}
function renderHints(){ $('hint-label').textContent = `HINTS [${hints}/3 REMAINING]`; $('btn-hint').style.opacity = hints && hintsOn() ? 1 : .6; }
$('btn-hint').onclick = () => {
if (over) return toast('Hints are unavailable once the game has ended.');
if (!hintsOn()) return toast('Hints are turned off in Settings.', true);
if (!hints) return dlg({ icon:'💡', title:'No hints remaining', body:'All 3 hints have been used.', actions:[OK] });
const k = hudTarget();
if (!k) return dlg({ icon:'💡', title:'Hint', body:'You have all 4 items. Head to the exit door.', actions:[OK] });
if (!hintsLeftFor(k)) return dlg({ icon:'💡', title:'No more hints here', body:`You already saw every hint for <b>${P[k].title}</b>. No hint was used.`, actions:[OK] });
dlg({ icon:'💡', title:'Use a hint?', body:`This hint is for <b>${P[k].title}</b>.<br><b>${hints} of 3</b> hints remaining.<br>A used hint cannot be returned.`,
actions:[ { l:'Cancel', k:'sec' }, { l:'Use Hint', f:() => {
const text = takeHint(k);
dlg({ icon:'💡', title:'Hint', body:`<b>${P[k].title}</b><p>${esc(text)}</p><p style="margin-top:12px;color:#fcd34d">Hints remaining: <b>${hints} of 3</b></p>`, actions:[OK] });
} } ] });
};

/* ---------- Settings from the main menu (settings.js): timer, hints, hint + inventory keys ---------- */
RemediateSettings.onChange(st => { $('timer-box').classList.toggle('hidden', !st.timer); renderHints(); });
document.addEventListener('keydown', e => {
if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || /^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
if (!$('modal').classList.contains('hidden') || !$('modal2').classList.contains('hidden')) return;
const k = RemediateSettings.get().keys;
if (e.code === k.hint) $('btn-hint').click();
else if (e.code === k.inventory) toast(got.length ? 'Items: ' + got.map(x => P[x].reward.join(' ')).join(', ') : 'Your inventory is empty.');
});

/* ---------- Menu ---------- */
function setLabels(v){ labels = v; $('hotspots').classList.toggle('labels-on', v); }
$('btn-menu').onclick = () => {
dlg({ icon:'⚙️', title:'Game menu', body:`
<label><input id="cb-labels" type="checkbox" ${labels ? 'checked' : ''}> Always show object labels</label>`,
actions:[ { l:'Leave Room', k:'dan', f:confirmLeave }, { l:'Resume' } ] });
$('cb-labels').onchange = e => setLabels(e.target.checked);
};
function confirmLeave(){
dlg({ icon:'🚪', title:'Leave the room?', body:`Your progress (<b>${count()} / 4</b> solved) will be lost.`,
actions:[ { l:'Stay', k:'sec' }, { l:'Leave Room', k:'dan', f:() => {
over = 'left'; guard.stop();
const savedLeave = queueSave('left'); // wait for the save so the dashboard shows this game
dlg({ icon:'👋', title:'You left the room', body:'Saving your result and opening your dashboard...', actions:[{ l:'Enter Again', f:async () => { await savedLeave; location.reload(); } }] });
escFn = null;
savedLeave.then(() => { location.href = 'dashboard.html'; });
} } ] });
}

/* Placement helper: open room.html?place=1, then click the spot where the wall clock icon should be */
if (new URLSearchParams(location.search).has('place')) {
$('stage').addEventListener('click', e => {
if (e.target.closest('[data-hs],.hud,#modal')) return;
const r = $('stage').getBoundingClientRect();
const x = ((e.clientX - r.left) / r.width * 100).toFixed(1), y = ((e.clientY - r.top) / r.height * 100).toFixed(1);
const c = document.querySelector('[data-hs="clock"]'); c.style.left = x + '%'; c.style.top = y + '%';
toast(`Wall clock icon position: top:${y}%;left:${x}%`); clearTimeout(toastT);
});
}

renderHints();
(async () => {
try { const u = await requireLogin(); if (!u) return; await setupRoom(u); startTs = Date.now(); await ensureSession(); guard.start(); }
catch (e) { console.error(e); }
})();
})();
</script>
