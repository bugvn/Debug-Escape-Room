<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>REMEDIATE: Cozy Starlight Escape Room</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
:root{--ts:1}
body{margin:0;height:100vh;width:100vw;overflow:hidden;background:#000;color:#f1f5f9;display:flex;justify-content:center;align-items:center;font-family:monospace}
button{font-family:inherit}
#hotspots,.hud{user-select:none}
.hidden{display:none!important}
.pix{font-family:'Press Start 2P',monospace}
.dig{font-family:'VT323',monospace}
#room{position:relative;width:100%;height:100%;max-width:1920px;max-height:1080px;margin:0 auto;overflow:hidden;background:#070d1b;display:flex;align-items:center;justify-content:center;container-type:size}
/* image and hotspots share one 16:9 box, so the icons stay on their objects at any window size */
#starfield-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#pixel-stars{position:absolute;top:0;left:0;pointer-events:none;image-rendering:pixelated;transition:opacity .4s}
#room.pz-open #pixel-stars{opacity:.35} /* dimmed while the puzzle window is open */
#stage{position:relative;flex:none;width:min(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9}
#stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%)}
/* wide windows: the room fills the whole screen like before (crops a little, more from the bottom so the window icon stays clear of the timer); icons live inside #stage so they scale with the picture */
@media(min-width:768px){#room{align-items:flex-start}#stage{width:max(100cqw,calc(100cqh * 16 / 9));margin-top:calc((100cqh - max(100cqw * 9 / 16, 100cqh)) * .3)}#stage>img{-webkit-mask-image:none;mask-image:none}}
.box{border:3px solid #6366f1;box-shadow:0 0 10px rgba(99,102,241,.4),inset 0 0 10px rgba(99,102,241,.2);backdrop-filter:blur(8px);background:rgba(10,15,30,.86)}
.btn{font:12px 'Press Start 2P',monospace;padding:12px 16px;border-radius:4px;cursor:pointer;border:2px solid #a855f7;box-shadow:0 4px 0 #6b21a8;background:#6b21a8;color:#fde047;transition:all .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b21a8}
.btn.sec{border-color:#64748b;box-shadow:0 4px 0 #334155;background:#1e293b;color:#e2e8f0}
.btn.dan{border-color:#f87171;box-shadow:0 4px 0 #7f1d1d;background:#7f1d1d;color:#fee2e2}
button:focus-visible,input:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}

/* hotspots */
#hotspots{position:absolute;inset:0;z-index:10}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;padding:0}
.hs .wrap{position:relative;display:flex;align-items:center;justify-content:center;width:34px;height:34px}
.hs .ping{position:absolute;width:100%;height:100%;border-radius:50%;background:var(--ping);animation:pulse 2.2s infinite ease-in-out}
.hs .core{position:relative;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--core);border:1px solid var(--bd);font-size:10px;color:#fff;font-weight:bold;box-shadow:0 0 10px var(--ping)}
.tag{opacity:0;transform:translateY(4px);transition:all .2s;pointer-events:none;white-space:nowrap;margin-top:4px;padding:4px 8px;background:rgba(15,23,42,.9);border:1px solid var(--tagb);border-radius:4px;font:calc(10px * var(--ts)) 'Press Start 2P',monospace;color:var(--tag)}
.hs:hover .tag,.hs:focus-visible .tag,.labels-on .tag{opacity:1;transform:none}
.cyan{--ping:rgba(34,211,238,.4);--core:rgba(6,182,212,.9);--bd:#a5f3fc;--tag:#67e8f9;--tagb:rgba(34,211,238,.8)}
.amber{--ping:rgba(251,191,36,.4);--core:rgba(245,158,11,.9);--bd:#fde68a;--tag:#fcd34d;--tagb:rgba(251,191,36,.8)}
.emerald{--ping:rgba(52,211,153,.4);--core:rgba(16,185,129,.9);--bd:#a7f3d0;--tag:#6ee7b7;--tagb:rgba(52,211,153,.8)}
.rose{--ping:rgba(244,63,94,.4);--core:rgba(225,29,72,.9);--bd:#fda4af;--tag:#fda4af;--tagb:rgba(244,63,94,.8)}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}50%{transform:scale(1.25);opacity:.4}100%{transform:scale(.85);opacity:.9}}
@keyframes ping{75%,100%{transform:scale(2);opacity:0}}

/* ---------- Living room (see LIVING in the script): one glow colour, objects light up under the mouse ---------- */
#stage:not(.ready){opacity:0}
#stage[data-room=living]>img.kitchen,#stage:not([data-room=living])>img.lr{display:none}
#stage>img.lr{image-rendering:pixelated}
#room.living{background:radial-gradient(ellipse at 50% 50%,#252e57 0%,#121830 45%,#05080f 100%)}
@media(min-width:768px){#room.living{align-items:center}#room.living #stage{width:min(100cqw,calc(100cqh * 16 / 9));margin-top:0}}
#stage[data-room=living]>.obj{--g:103,232,249}
#stage[data-room=living]>.obj[data-k=door]{--g:239,68,68}
@keyframes objglow{0%,100%{filter:drop-shadow(0 0 calc(var(--px,3px) * 1.5) rgba(var(--g),.45)) drop-shadow(0 0 calc(var(--px,3px) * .6) rgba(var(--g),.6)) brightness(1)}50%{filter:drop-shadow(0 0 calc(var(--px,3px) * 4) rgba(var(--g),1)) drop-shadow(0 0 calc(var(--px,3px) * 1.6) rgba(var(--g),1)) brightness(1.15)}}
#stage[data-room=living]>.obj.hov{animation:none;filter:drop-shadow(var(--px,3px) 0 0 rgb(var(--g))) drop-shadow(calc(var(--px,3px) * -1) 0 0 rgb(var(--g))) drop-shadow(0 var(--px,3px) 0 rgb(var(--g))) drop-shadow(0 calc(var(--px,3px) * -1) 0 rgb(var(--g))) drop-shadow(0 0 calc(var(--px,3px) * 3) rgba(var(--g),.8)) brightness(1.12)}
#stage[data-room=living]>.obj[data-k=door]:not(.ready).hov{animation:none;filter:drop-shadow(var(--px,3px) 0 0 rgb(var(--g))) drop-shadow(calc(var(--px,3px) * -1) 0 0 rgb(var(--g))) drop-shadow(0 var(--px,3px) 0 rgb(var(--g))) drop-shadow(0 calc(var(--px,3px) * -1) 0 rgb(var(--g))) drop-shadow(0 0 calc(var(--px,3px) * 7) rgba(var(--g),1)) drop-shadow(0 0 calc(var(--px,3px) * 16) rgba(var(--g),.85)) brightness(1.3)}
#stage[data-room=living]>.obj.done{animation:none;filter:grayscale(1) brightness(.65) drop-shadow(0 0 2px rgba(148,163,184,.25));transition:filter .4s}
#stage[data-room=living] .hs.hit{display:block;transform:none;pointer-events:none}
.hs.hit .wrap{display:none}
.hs.hit .tag{position:absolute;left:50%;bottom:100%;margin:0 0 6px;transform:translate(-50%,4px)}
.hs.hit:focus-visible .tag,.hs.hit.show .tag,.labels-on .hs.hit .tag{opacity:1;transform:translate(-50%,0)}
.hs.hit:focus-visible{outline:none}

/* ================= HUD ================= */
.hud{position:absolute;z-index:20}

/* shared panel look: lighter navy fill, bright border in each panel's own colour (--ac), no blue glow */
:root{--hud-bg:rgba(34,45,90,.95)}
.hud.box,.hbtn.box,#menu-pop{background:var(--hud-bg);border:2px solid color-mix(in srgb,var(--ac,#94a3b8) 38%,transparent);box-shadow:0 0 6px color-mix(in srgb,var(--ac,#94a3b8) 18%,transparent),inset 0 0 0 1px rgba(255,255,255,.04)}
#progress{--ac:#fbbf24;--acg:rgba(251,191,36,.45)}
#integrity-hud{--ac:#4ade80;--acg:rgba(74,222,128,.4)}
#hud-left #integrity-hud{width:calc(75% - 11px);align-self:flex-start;padding:7px 12px 8px;border-radius:4px}
#integrity-hud .hrow{margin-bottom:9px}
#integrity-hud .hlbl,#integrity-hud .hcnt{font-size:10px}
#integrity-hud .gbar{gap:3px;padding:2px}
#integrity-hud .gbar>*{height:8px}
#timer-box{--ac:#22d3ee;--acg:rgba(34,211,238,.45)}
#timer-box.hud.box{border:3px solid #22d3ee;box-shadow:0 0 14px rgba(34,211,238,.6),inset 0 0 0 1px rgba(255,255,255,.1)}

/* top-left stack: two bars of the same width. PROGRESS fills gold as puzzles are solved, INTEGRITY starts full (green) and drains on strikes */
#hud-left{top:24px;left:24px;display:flex;flex-direction:column;align-items:stretch;gap:10px;width:clamp(240px,22vw,320px);zoom:var(--ts)}
#hud-left .hud{position:static}
#progress,#integrity-hud{padding:10px 14px 12px;border-radius:6px;display:block}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.hlbl,.hcnt{font:12px 'Press Start 2P',monospace;white-space:nowrap}
.hlbl{letter-spacing:.06em}
#progress .hlbl,#progress .hcnt{color:#fef08a;text-shadow:0 0 10px rgba(253,224,71,.9);font-size:13px}
#integrity-hud .hlbl,#integrity-hud .hcnt{color:#bbf7d0;text-shadow:0 0 10px rgba(134,239,172,.9)}
.gbar{display:flex;gap:4px;padding:3px;background:#0f172a;border:2px solid rgba(255,255,255,.55);border-radius:3px}
.gbar>*{flex:1;height:16px;border-radius:1px;background:rgba(148,163,184,.32);transition:background .3s,box-shadow .3s}
.gbar>.node.active{box-shadow:inset 0 0 0 2px rgba(253,224,71,.55)}
.gbar>.node.solved{background:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.9)}
.gbar>.seg{background:#4ade80;box-shadow:0 0 10px rgba(74,222,128,.8)}
.gbar>.seg.warn{background:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.9)}
.gbar>.seg.lost{background:rgba(148,163,184,.18);box-shadow:none}
#progress .bar{display:none} /* kept in the HTML so the script that sets its width doesn't break */
#ig-chip{display:none!important} /* js/integrity.js floating chip replaced by #integrity-hud */
#ig-banner{top:auto!important;right:auto!important;bottom:18px!important;left:50%!important;transform:translateX(-50%)!important;max-width:min(92vw,520px)!important;text-align:center!important;pointer-events:none}

#timer-box{top:24px;left:50%;transform:translateX(-50%);padding:10px 32px;border-radius:8px;display:flex;flex-direction:column;align-items:center}
#timer-label{font-size:11px;color:#67e8f9;letter-spacing:.1em;margin-bottom:4px}
#timer{font-size:calc(clamp(36px,4.5vw,60px) * var(--ts));letter-spacing:.1em;line-height:1;color:#22d3ee;text-shadow:0 0 8px rgba(34,211,238,.55)}

/* top-right: mute button, then menu at the edge */
#controls{top:24px;right:24px;display:flex;gap:8px;align-items:flex-start;zoom:var(--ts)}
.hbtn{font:11px 'Press Start 2P',monospace;color:#cbd5e1;padding:8px 12px;border-radius:4px;cursor:pointer;transition:color .15s,background .15s}
.hbtn:hover{background:rgba(30,27,75,.8);color:#67e8f9}
#mute-ic{font-size:20px;line-height:11px;display:inline-block}
#btn-mute{font-size:16px;line-height:1;padding:6px 10px;min-height:34px}
#btn-menu:hover{color:#fcd34d}
#menu-wrap{position:relative}
#menu-pop{position:absolute;top:calc(100% + 8px);right:0;min-width:230px;padding:6px;border-radius:6px;display:flex;flex-direction:column;gap:2px}
.mi{font:10px 'Press Start 2P',monospace;color:#cbd5e1;background:none;border:0;text-align:left;padding:10px 12px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%}
.mi:hover{background:rgba(30,27,75,.8);color:#67e8f9}
.mi.who{flex-direction:column;align-items:flex-start;gap:6px;cursor:default}
.mi.who:hover{background:none;color:#cbd5e1}
.mi.who small{color:#64748b;font-size:8px}
.mi .car{margin-left:auto}
.ei{font-size:18px;line-height:12px;display:inline-block;width:24px;text-align:center}
.ei{font-size:18px;line-height:12px;display:inline-block;width:24px;text-align:center}
.subs{display:flex;flex-direction:column;gap:2px;padding-left:14px}
.mi.sub{color:#a5b4fc;padding:8px 12px}
.mi.danger{color:#fca5a5;border-top:1px solid rgba(99,102,241,.4);margin-top:4px;padding-top:12px}
.mi.danger:hover{background:rgba(127,29,29,.5);color:#fecaca}

/* bottom-left: HINTS [bulb][bulb][bulb]  (violet panel, yellow pixel bulbs: lit = hint left, dark outline = used) */
#hint-wrap{bottom:24px;left:24px;zoom:var(--ts)}
#btn-hint{--ac:#a78bfa;--acg:rgba(167,139,250,.5);background:var(--hud-bg);height:70px;padding:0 16px;border-radius:6px;display:flex;align-items:center;gap:14px;letter-spacing:.05em;border:2px solid rgba(167,139,250,.45);box-shadow:0 0 8px rgba(167,139,250,.2)}
#btn-hint:hover{border-color:rgba(167,139,250,.85);background:rgba(30,27,75,.95)}
#btn-hint .hl{font:12px 'Press Start 2P',monospace;color:#ddd6fe}
#hint-label{display:flex;gap:8px}
.bulb{width:24px;height:24px;display:block}
.bulb .o{fill:#92400e}.bulb .f{fill:#fde047}.bulb .h{fill:#fff9c4}.bulb .b{fill:#d6d3d1}
.bulb.lit{filter:drop-shadow(0 0 5px rgba(253,224,71,.85))}
.bulb.used .o{fill:#8b7fc9}.bulb.used .f{fill:#1e1b3a}.bulb.used .h{fill:none}.bulb.used .b{fill:#475569}

/* bottom-right: inventory (slate panel, empty slots are plain boxes, a collected item glows gold) */
#inv{--ac:#94a3b8;bottom:24px;right:24px;padding:10px 16px;border-radius:6px;display:flex;align-items:center;gap:12px;zoom:var(--ts)}
#inv .lbl{font-size:11px;color:#e2e8f0;letter-spacing:.05em;margin-right:4px}
.slot{width:48px;height:48px;background:rgba(148,163,184,.16);border:2px solid #94a3b8;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:26px;transition:box-shadow .3s,border-color .3s}
.slot span{display:none}
.slot.filled{background:rgba(251,191,36,.16);border-color:#fbbf24;box-shadow:0 0 12px rgba(251,191,36,.85),inset 0 0 8px rgba(251,191,36,.35)}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;white-space:nowrap;opacity:0;pointer-events:none;background:rgba(15,23,42,.95);border:1px solid #67e8f9;color:#a5f3fc;font:10px 'Press Start 2P',monospace;padding:5px 8px;border-radius:4px;transition:opacity .15s}
[data-tip].tip-top::after{top:auto;bottom:calc(100% + 8px);right:auto;left:0}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1}

/* toast + dialogs (toast sits above the integrity notice so they never overlap) */
#toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);z-index:30;padding:12px 20px;border-radius:6px;font:calc(12px * var(--ts)) 'Press Start 2P',monospace;line-height:1.6;color:#a5f3fc;text-align:center;max-width:70%;pointer-events:none}
#toast.warn{color:#fca5a5;border-color:#ef4444}
#modal{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center}
.dialog{width:90%;max-width:448px;max-height:92%;overflow-y:auto;padding:24px;border-radius:8px;zoom:var(--ts)}
.dialog.wide{max-width:680px}
.dialog{position:relative}
.dialog.center{max-width:460px;padding:32px 28px 26px;text-align:center}
.dialog.center h2{font-size:16px;margin:6px 0 14px}
.dialog.center .dbody{font-size:24px;line-height:1.25;color:#cbd5e1}
.dialog.center #da{justify-content:stretch;gap:14px;margin-top:22px}
.dialog.center #da .btn{flex:1}
.dialog.center .btn.sec{background:transparent;box-shadow:none;border:2px solid #94a3b8;color:#e2e8f0}
.dialog.center .btn.sec:hover{background:rgba(148,163,184,.14)}
.dlg-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(148,163,184,.16);color:#cbd5e1;font:13px 'Press Start 2P',monospace;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dlg-x:hover{background:rgba(148,163,184,.32);color:#fff}
/* ---- settings pop-ups: same look as the dashboard's System Settings (dark teal panel, cyan frame, toggle switches, slightly rounded) ---- */
#modal:has(.dialog.set){backdrop-filter:blur(4px)}
.dialog.set{max-width:560px;padding:22px 24px 20px;background:#071b29;border:2px solid #38e1ff;border-radius:8px;box-shadow:0 0 22px rgba(56,225,255,.28),inset 0 0 0 1px rgba(56,225,255,.08)}
.dialog.set h2{margin:0 0 6px;padding-bottom:16px;border-bottom:1px solid rgba(56,225,255,.22);color:#f1f5f9;font-size:14px;letter-spacing:.06em}
.dialog.set .st-desc{display:none}
.dialog.set .st-row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"nm ctl" "sd ctl";column-gap:20px;row-gap:4px;align-items:center;padding:14px 0;border:0;border-bottom:1px solid rgba(56,225,255,.16)}
.dialog.set .st-row::before{display:none}
.dialog.set .st-row .nm{grid-area:nm;padding:0;font:700 16px 'Space Mono',monospace;color:#f1f5f9}
.dialog.set .st-row .sd{grid-area:sd;font:8px/1.5 'Press Start 2P',monospace;color:#94a3b8}
.dialog.set .st-ctl{grid-area:ctl;padding-left:0;justify-content:flex-end}
.dialog.set .st-ctl b{min-width:52px;text-align:right;font:12px 'Press Start 2P',monospace;color:#7ae8ff}
.dialog.set .dbody input[type=range]{-webkit-appearance:none;appearance:none;flex:none;width:190px;height:8px;border-radius:4px;background:linear-gradient(to right,#7ae8ff var(--v,100%),rgba(122,232,255,.18) var(--v,100%));cursor:pointer}
.dialog.set .dbody input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border:0;border-radius:50%;background:#7ae8ff;box-shadow:0 0 8px rgba(122,232,255,.7)}
.dialog.set .dbody input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#7ae8ff}
.dialog.set .tgl{position:relative;display:block;width:68px;height:32px;margin:0;cursor:pointer}
.dialog.set .tgl input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.dialog.set .tgl-track{position:absolute;inset:0;border:1px solid #475569;border-radius:6px;background:#06141f;transition:border-color .2s}
.dialog.set .tgl-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:4px;background:#475569;transition:transform .2s,background .2s,box-shadow .2s}
.dialog.set .tgl input:checked + .tgl-track{border-color:#7ae8ff}
.dialog.set .tgl input:checked + .tgl-track .tgl-knob{transform:translateX(36px);background:#7ae8ff;box-shadow:0 0 8px rgba(122,232,255,.7)}
.dialog.set .tgl input:focus-visible + .tgl-track{outline:3px solid #22d3ee;outline-offset:2px}
.dialog.set .st-sel{min-width:150px;padding:8px 12px;font:700 14px 'Space Mono',monospace;background:#06141f;color:#f1f5f9;border:1px solid #7ae8ff;border-radius:6px}
.dialog.set .btn{padding:12px 16px;font:10px 'Press Start 2P',monospace;letter-spacing:.04em;border:1px solid #7ae8ff;border-radius:6px;background:#7ae8ff;color:#061d29;box-shadow:none}
.dialog.set .btn:hover{filter:brightness(1.08)}
.dialog.set .btn.sec{background:transparent;color:#e2f7ff}
.dialog.set .btn.sec:hover{background:rgba(122,232,255,.12)}
.dialog.set .st-ctl .btn{padding:10px 14px;min-width:84px}
.dialog.set #da{margin-top:20px;gap:10px}
.dialog h2{font:14px/1.6 'Press Start 2P',monospace;color:#fcd34d;margin:0 0 16px}
.dbody{font:24px/1.25 'VT323',monospace;color:#e2e8f0}
.dbody p{margin:0 0 10px}
.dbody label{display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer}
.dbody input[type=checkbox]{width:20px;height:20px;accent-color:#a855f7}
.dbody input[type=range]{flex:1;accent-color:#a855f7;cursor:pointer}
.dbody .rowv{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dbody .rowv .nm{min-width:96px}
.dbody .rowv b{min-width:48px;text-align:right;color:#fcd34d}
.dbody .btn{padding:8px 12px;font-size:11px}
#da{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.code{margin:0 0 8px;padding:10px 14px;background:#020617;border:1px solid #334155;border-radius:4px;font:22px/1.2 'VT323',monospace;color:#a5f3fc;white-space:pre;overflow-x:auto;user-select:text}
.err{color:#fca5a5}
.st-desc{font:20px/1.2 'VT323',monospace;color:#94a3b8;margin:0 0 12px}
.st-row{position:relative;display:grid;grid-template-columns:1fr 270px;align-items:center;padding:12px 0;border-top:1px solid rgba(148,163,184,.3)}
.st-row::before{content:'';position:absolute;top:-1px;bottom:0;right:270px;width:1px;background:rgba(148,163,184,.3)}
.st-row .nm{font:24px 'VT323',monospace;color:#e2e8f0;padding-right:12px}
.st-ctl{display:flex;align-items:center;gap:10px;padding-left:16px}
.dbody .st-ctl input[type=range]{flex:none;width:180px}

<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
sessionStorage.removeItem('lastSessionId');

/* ---------- Settings helpers (audio, text size, labels, controls). Saved in localStorage so every room shares them ---------- */
const LS_KEY = 'remediate.settings.v1', TS_KEY = 'remediate.textScale', LB_KEY = 'remediate.labels';
const readLS = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } };
const cur = () => Object.assign({ master:100, bgm:80, timer:true, hints:true, keys:{ hint:'KeyH', inventory:'KeyI' } }, RemediateSettings.get(), readLS());
function applyTimerVis(){ $('timer-box').classList.remove('hidden'); }
function setS(patch){
  try { localStorage.setItem(LS_KEY, JSON.stringify(Object.assign({}, readLS(), patch))); } catch (e) {}
  if (typeof RemediateSettings.set === 'function') { try { RemediateSettings.set(patch); } catch (e) {} }
  document.dispatchEvent(new Event('remediate:settings'));
  applyTimerVis(); renderHints();
}
let textScale = parseFloat(localStorage.getItem(TS_KEY)) || 1;
function applyScale(){ textScale = Math.min(1.4, Math.max(.8, Math.round(textScale * 10) / 10)); document.documentElement.style.setProperty('--ts', textScale); try { localStorage.setItem(TS_KEY, textScale); } catch (e) {} }
let labelsOn = localStorage.getItem(LB_KEY) === 'true';
function applyLabels(){ document.body.classList.toggle('labels-on', labelsOn); try { localStorage.setItem(LB_KEY, labelsOn); } catch (e) {} }
applyScale(); applyLabels();

/* quick mute button (top right) */
const muteIcon = () => { $('mute-ic').textContent = RemediateAmbient.getMuted() ? '🔇' : '🔊'; $('audio-toggle-btn').setAttribute('aria-label', RemediateAmbient.getMuted() ? 'Unmute music' : 'Mute music'); };
$('audio-toggle-btn').onclick = e => { e.stopPropagation(); RemediateAmbient.setMuted(!RemediateAmbient.getMuted()); if (!RemediateAmbient.getMuted()) RemediateAmbient.ensureStarted(); muteIcon(); };
muteIcon();

/* key re-binding: must run before every other key handler */
let rebind = null;
document.addEventListener('keydown', e => {
  if (!rebind) return;
  e.preventDefault(); e.stopImmediatePropagation();
  if (e.code !== 'Escape') setS({ keys: Object.assign({}, cur().keys, { [rebind.k]: e.code }) });
  const r = rebind; rebind = null; r.done();
}, true);

/* ---------- Timer (counts up from 00:00; keeps running while menus and dialogs are open) ---------- */
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
let startTs = Date.now();
let elapsed = 0;
function tick(){ if (over) return; elapsed = Math.floor((Date.now() - startTs) / 1000); $('timer').textContent = fmt(elapsed); const t = $('sf-time'); if (t) t.textContent = fmt(elapsed); }
setInterval(tick, 1000);

/* ---------- State: items collected = puzzles solved ---------- */
const PUZ = ['window', 'kettle', 'fridge', 'clock'];
const got = []; // puzzle ids solved, in order (one inventory item each)
const drafts = {}; // the player's unsaved edits per puzzle
const hintTier = {}; let lastOpen = null;
/* time spent inside each puzzle window (pauses while the window is closed) */
const spent = {}, nTry = {}; let openId = null, openTs = 0;
function pauseP(){ if (openId) { spent[openId] = (spent[openId] || 0) + Date.now() - openTs; openId = null; } }
const spentMs = k => (spent[k] || 0) + (openId === k ? Date.now() - openTs : 0);
let hints = 3, over = null, toastT, escFn = null;
const count = () => got.length;

/* ---------- Saving: the session row is made at start, each attempt is saved as it happens ---------- */
const attempts = [];    // attempts not saved yet (kept and retried if a save fails)
const integrityQueue = []; let integrityFails = 0; // anti-cheat events not saved yet (see js/integrity.js)
const allAttempts = []; // every attempt of this game, used by the level rules at the end
let sessionId = null, sessionMaking = null, saveWarned = false, saveChain = Promise.resolve();
function timeCols(){
elapsed = Math.floor((Date.now() - startTs) / 1000);
return { elapsed_sec: elapsed };
}
function ensureSession(){
if (sessionId) return Promise.resolve(sessionId);
if (!sessionMaking) sessionMaking = (async () => {
try {
const { data, error } = await db.from('game_sessions').insert({ result:'in_progress', solved_count:0, hints_used:0, elapsed_sec:0, level: roomLevel, puzzle_ids: roomPuzzleIds }).select('id').single();
if (error) throw error;
sessionId = data.id; sessionStorage.setItem('lastSessionId', sessionId);
} catch (e) { console.error(e); }
sessionMaking = null; return sessionId;
})();
return sessionMaking;
}
async function saveAll(result){
let ok = true;
try {
const sid = await ensureSession();
if (!sid) throw new Error('no session');
if (attempts.length) {
const batch = attempts.splice(0);
const r = await db.from('submissions').insert(batch.map(a => ({ ...a, session_id: sid })));
if (r.error) { attempts.unshift(...batch); throw r.error; }
}
// anti-cheat log: saved on the side. If sql/migration-03.sql was not run yet this must never break saving the game
if (integrityQueue.length && integrityFails < 3) {
const ev = integrityQueue.splice(0);
const r = await db.from('integrity_events').insert(ev.map(e => ({ ...e, session_id: sid })));
if (r.error) { integrityFails++; console.warn('integrity_events not saved:', r.error.message); if (integrityFails < 3) integrityQueue.unshift(...ev); }
}
const u = await db.from('game_sessions').update({ ...(result ? { result, next_level: roomAdaptive ? nextLevel({ level: roomLevel, result, solved_count: count(), hints_used: 3 - hints, elapsed_sec: timeCols().elapsed_sec }, allAttempts) : roomLevel } : {}), solved_count: count(), hints_used: 3 - hints, ...timeCols() }).eq('id', sid);
if (u.error) throw u.error;
} catch (e) {
ok = false; console.error(e);
if (!saveWarned) { saveWarned = true; toast('Could not save your progress. Check connection.', true); }
}
return ok;
}
// saves run one after another, so the final result is never overwritten by an older save
function queueSave(result){ return (saveChain = saveChain.then(() => saveAll(result))); }

/* ---------- Anti-cheat (js/integrity.js): no copy/paste, no leaving the window, 3 strikes closes the room ---------- */
const guard = createIntegrityGuard({
  getPuzzleId: () => (typeof openId === 'string' && P[openId] ? P[openId].pid : null),
  onEvent: ev => { integrityQueue.push(ev); queueSave(); renderShields(); },
  onLimit: () => {
    if (over) return;
    over = 'left'; guard.stop(); closeDlg();

// Hidden checks, so a correct fix written a different way still passes but a hardcoded answer does not:
// 1) same code on different data, 2) call the function with a new input, 3) the result must come from a real call.
async function hardcoded(p, code){
if (p.variant) {
if (!new RegExp(p.variant.re).test(code)) return { bad:true };   // the original data was deleted
const d = await runPy(applyVariant(code, p.variant));
if (d.sys) return { sys:d.sys };
if (d.err || (d.out || '').trim() !== p.variant.expect) return { bad:true };
}
for (const pr of (p.probes || [])) {
const f = pr.fn;
const d = await runPy(code + `\nimport inspect as _i\n_n = len(_i.signature(${f}).parameters)\nprint("@@PROBE@@" + str(${f}(*${pyLiteral(pr.args)}[:_n])))`);
if (d.sys) return { sys:d.sys };
const got = (d.out || '').split('@@PROBE@@')[1];
if (d.err || got === undefined || got.trim() !== pr.expect) return { bad:true };
}
if (p.needCall) {
const d = await runPy(`import ast
src = ${JSON.stringify(code)}
tree = ast.parse(src)
par = {}
for n in ast.walk(tree):
    for c in ast.iter_child_nodes(n): par[c] = n
ok = any(isinstance(n, ast.Call) and getattr(n.func, 'id', None) == ${JSON.stringify(p.needCall)} and not isinstance(par.get(n), ast.Expr) for n in ast.walk(tree))
print("@@AST@@" + ("ok" if ok else "bad"))`);
if (d.sys) return { sys:d.sys };
if (d.err || !(d.out || '').includes('@@AST@@ok')) return { bad:true };
}
return {};
}
// Runs the code in Python and checks it against the puzzle. kind = 'run' (test button) or 'submit'.
// Every real attempt is saved. Python failing to load is NOT an attempt and is never saved.
async function evaluate(id, code, kind){
const p = P[id];
const d = await runPy(code);
if (d.sys) return { ok:false, sys:true, msg:esc(d.sys) };
const out = (d.out || '').trim();
let tag = null, msg = '', raw = null;
if (d.err) {
const last = cleanErr(d.err).trim().split('\n').pop();
const m = last.match(/^(\w*Error)/);
tag = !m ? 'Runtime Error' : m[1] === 'TimeoutError' ? 'Infinite Loop' : m[1];
msg = 'Python says: ' + esc(last); raw = d.err;
} else if (out !== p.expect) { tag = 'Wrong Output'; msg = `It ran, but printed "${esc(out)}" instead of "${esc(p.expect)}".`; }
else {
const h = await hardcoded(p, code);
if (h.sys) return { ok:false, sys:true, msg:esc(h.sys) };
if (h.bad) { tag = 'Hardcoded Answer'; msg = 'The output matches, but the fix only works for this one case. Keep the original code and fix the actual bug.'; }
}
const row = { puzzle: p.title, kind, code: code.slice(0, 2000), is_correct: !tag, mistake_tag: tag,
puzzle_id: p.pid, category: p.category, difficulty: p.level, attempt_no: nTry[id] = (nTry[id] || 0) + 1,
hints_used: hintTier[id] || 0, elapsed_ms: Math.round(spentMs(id)), mistake_category: tag ? categoryOfTag(tag) : null };
attempts.push(row); allAttempts.push(row);
queueSave();
return { ok: !tag, tag, msg, raw, codeLines: code.split('\n').length, out, expect: p.expect };
}

dlg({ center:true, x:true, title:"Are you sure you're leaving?", body:`If you leave now, your progress (<b>${count()} / 4</b> solved) will be lost.`,
actions:[ { l:'Cancel', k:'sec' }, { l:'Leave', k:'dan', f:() => {
over = 'left'; guard.stop();
const savedLeave = queueSave('left'); // wait for the save so the dashboard shows this game
dlg({ title:'You left the room', body:'Saving your result and opening your dashboard...', actions:[{ l:'Enter Again', f:async () => { await savedLeave; location.reload(); } }] });
escFn = null;
savedLeave.then(() => { location.href = 'dashboard.html'; });
} } ] });
}

/* Placement helper: open room.html?place=1, then click the spot where the wall clock icon should be */
if (new URLSearchParams(location.search).has('place')) {
$('stage').addEventListener('click', e => {
if (e.target.closest('[data-hs],.hud,#modal')) return;
const r = $('stage').getBoundingClientRect();
const x = ((e.clientX - r.left) / r.width * 100).toFixed(1), y = ((e.clientY - r.top) / r.height * 100).toFixed(1);
const c = document.querySelector('[data-hs="clock"]'); c.style.left = x + '%'; c.style.top = y + '%';
toast(`Wall clock icon position: top:${y}%;left:${x}%`); clearTimeout(toastT);
});
}

renderHints(); applyTimerVis();
(async () => {
try { await loadPuzzleBank(); const u = await requireLogin(); if (!u) return; await setupRoom(u); startTs = Date.now(); await ensureSession(); guard.start(); renderShields(); }
catch (e) { console.error(e); }
finally { $('stage').classList.add('ready'); }
})();
})();
</script>
</body></html>
