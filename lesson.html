  .con { background:#02060b; border:2px solid #153f50; min-height:5.5rem; padding:.7rem 1rem; font-family:'VT323',monospace; font-size:1.2rem; line-height:1.3; color:#dffcff; white-space:pre-wrap; word-break:break-word; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const DONE_KEY = 'remediate.lessonDone';

// Only logged-in players can use the module, same as the game room
try { requireLogin().catch(e => console.error(e)); } catch (e) { console.error(e); }

/* ---------- Lesson content ---------- */
// code blocks: [style, text]. style: '' | 'bad' | 'good'
const LESSONS = [
{
  tag: 'BASICS', title: 'How to Read a Bug',
  intro: 'Every bug in the room shows up as an error message or as the wrong output. Both tell you where to look.',
  points: [
    '<b>Run the code first.</b> Do not guess. The error message is a clue.',
    '<b>Read the last line of the error.</b> It names the type of problem, such as IndexError or TypeError, and says what went wrong.',
    '<b>Check the line number</b> above it. That is where Python noticed the problem. The cause can be a line or two earlier.',
    '<b>Change one thing, then run again.</b> Fixing one line at a time shows you which change worked.'
  ],
  code: [['bad', `Traceback (most recent call last):
  File "main.py", line 3, in &lt;module&gt;
    total += stars[i]
<span class="er">IndexError: list index out of range</span>`]],
  note: 'In the room: use RUN TEST to try your fix as many times as you like. Only SUBMIT counts as your answer.',
  tryit: { task: "Run it and read the error. Then change the index so it prints blue.", goal: "blue", code: "colors = [\"red\", \"blue\"]\nprint(colors[2])" },
  refs: [["Errors and Exceptions (Python Tutorial)", "https://docs.python.org/3/tutorial/errors.html"], ["Built-in Exceptions", "https://docs.python.org/3/library/exceptions.html"]]
},
{
  tag: 'INDEX FAULT', title: 'Lists and Index Errors',
  intro: 'A list keeps items in order, and each item has a position number called an index. Python starts counting at 0, not 1.',
  points: [
    'A list with <b>3 items</b> has the indexes <b>0, 1, 2</b>. The last valid index is always <b>len(list) - 1</b>.',
    'Asking for an index that does not exist causes an <b>IndexError</b>.',
    'The most common cause is an <b>off-by-one</b> mistake: a loop that runs one time too many.',
    'To go through every item safely, loop over the list itself.'
  ],
  code: [
    ['', `fruits = ["apple", "mango", "kiwi"]
print(fruits[0])   <span class="cm"># apple</span>
print(fruits[2])   <span class="cm"># kiwi</span>`],
    ['bad', `print(fruits[3])   <span class="cm"># there is no index 3</span>
<span class="er">IndexError: list index out of range</span>`],
    ['good', `<span class="kw">for</span> fruit <span class="kw">in</span> fruits:
    print(fruit)       <span class="cm"># never goes past the end</span>`]
  ],
  note: 'Watch for: range(len(items) + 1). The + 1 makes the loop run one extra time.',
  tryit: { task: "Run it. The loop crashes at the end. Fix it so it prints all 3 fruits and stops.", goal: "apple\nmango\nkiwi", code: "fruits = [\"apple\", \"mango\", \"kiwi\"]\nfor i in range(len(fruits) + 1):\n    print(fruits[i])" },
  refs: [["Lists (Python Tutorial)", "https://docs.python.org/3/tutorial/introduction.html#lists"], ["for Statements (Python Tutorial)", "https://docs.python.org/3/tutorial/controlflow.html#for-statements"], ["IndexError (Built-in Exceptions)", "https://docs.python.org/3/library/exceptions.html#IndexError"]]
},
{
  tag: 'TYPE FAULT', title: 'Data Types and Type Errors',
  intro: 'Every value has a type. Text is a string (str) and whole numbers are integers (int). Python will not mix them in math.',
  points: [
    'Anything inside quotes is a <b>string</b>, even if it looks like a number: <b>"7"</b> is text, <b>7</b> is a number.',
    'Adding a string and an integer causes a <b>TypeError</b>.',
    'Use <b>int()</b> to turn a numeric string into a number before doing math.',
    'Two strings added with + are joined together: "5" + "5" gives "55", not 10.'
  ],
  code: [
    ['bad', `age = "15"
print(age + 1)
<span class="er">TypeError: can only concatenate str (not "int") to str</span>`],
    ['good', `age = "15"
print(int(age) + 1)   <span class="cm"># 16</span>`]
  ],
  note: 'If the error mentions str and int together, check the quotes around your numbers.',
  tryit: { task: "Run it and read the error. Then fix it so it prints 16.", goal: "16", code: "age = \"15\"\nprint(age + 1)" },
  refs: [["Text Sequence Type: str", "https://docs.python.org/3/library/stdtypes.html#text-sequence-type-str"], ["int() (Built-in Functions)", "https://docs.python.org/3/library/functions.html#int"], ["TypeError (Built-in Exceptions)", "https://docs.python.org/3/library/exceptions.html#TypeError"]]
},
{
  tag: 'RECURSION FAULT', title: 'Recursion',
  intro: 'A recursive function calls itself. To work correctly it needs two things, or it will never stop.',
  points: [
    'A <b>base case</b>: the condition where the function stops and returns an answer.',
    '<b>Progress</b>: each call must change something so the next call gets closer to the base case.',
    'If the base case is never reached, Python stops it with a <b>RecursionError</b>.',
    'When you debug, ask: does the value I check ever change between calls?'
  ],
  code: [
    ['bad', `<span class="kw">def</span> countdown(n):
    <span class="kw">if</span> n == 0:
        <span class="kw">return</span> <span class="st">"liftoff"</span>
    <span class="kw">return</span> countdown(n)        <span class="cm"># n never changes</span>
<span class="er">RecursionError: maximum recursion depth exceeded</span>`],
    ['good', `<span class="kw">def</span> countdown(n):
    <span class="kw">if</span> n == 0:
        <span class="kw">return</span> <span class="st">"liftoff"</span>
    <span class="kw">return</span> countdown(n - 1)    <span class="cm"># moves toward 0</span>`]
  ],
  note: 'Remember: the answer must be returned all the way back up, so keep the return in front of the call.',
  tryit: { task: "Run it and wait for the error. Then make n move toward 0 so it prints liftoff.", goal: "liftoff", code: "def countdown(n):\n    if n == 0:\n        return \"liftoff\"\n    return countdown(n)\n\nprint(countdown(3))" },
  refs: [["Defining Functions (Python Tutorial)", "https://docs.python.org/3/tutorial/controlflow.html#defining-functions"], ["RecursionError (Built-in Exceptions)", "https://docs.python.org/3/library/exceptions.html#RecursionError"]]
},
{
  tag: 'SCOPE FAULT', title: 'Variable Scope',
  intro: 'A variable created inside a function only exists inside that function. Outside, Python does not know it.',
  points: [
    'Using a variable outside the place where it was created causes a <b>NameError</b>.',
    'A function can pass a value out with <b>return</b>.',
    'The code that calls the function must <b>catch</b> the returned value, usually by storing it in a variable.',
    'Calling a function without storing its result throws the result away.'
  ],
  code: [
    ['bad', `<span class="kw">def</span> double(n):
    result = n * 2
    <span class="kw">return</span> result

double(4)
print(result)
<span class="er">NameError: name 'result' is not defined</span>`],
    ['good', `<span class="kw">def</span> double(n):
    result = n * 2
    <span class="kw">return</span> result

result = double(4)     <span class="cm"># catch the returned value</span>
print(result)          <span class="cm"># 8</span>`]
  ],
  note: 'You are ready. Fix every bug in the room to collect all 4 items and open the exit door.',
  tryit: { task: "Run it and read the error. Then catch the returned value so it prints 8.", goal: "8", code: "def double(n):\n    result = n * 2\n    return result\n\ndouble(4)\nprint(result)" },
  refs: [["Python Scopes and Namespaces (Python Tutorial)", "https://docs.python.org/3/tutorial/classes.html#python-scopes-and-namespaces"], ["The return Statement (Language Reference)", "https://docs.python.org/3/reference/simple_stmts.html#return"], ["NameError (Built-in Exceptions)", "https://docs.python.org/3/library/exceptions.html#NameError"]]
}
];

/* ---------- Python (Pyodide) in a Web Worker, same setup as the game room ---------- */
const WORKER_SRC = `importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');
const ready = loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
ready.then(() => postMessage({ ready: true }), e => postMessage({ fatal: String(e) }));
onmessage = async e => {
const py = await ready; let out = '';
py.setStdout({ batched: s => out += s + '\\n' });
py.setStderr({ batched: s => out += s + '\\n' });
try { await py.runPythonAsync(e.data, { globals: py.globals.get('dict')() }); postMessage({ out }); }
catch (err) { postMessage({ out, err: String(err.message || err) }); }
};`;
let worker, pending = null, pyReady = false, pyFail = false, pyErr = '';
let loadStart = Date.now();
function refreshRun(){
  const b = $('btnRun'), n = $('loadNote');
  if (b) {
    const sec = Math.floor((Date.now() - loadStart) / 1000);
    b.disabled = !pyReady;
    b.textContent = pyFail ? '✖ PYTHON FAILED' : pyReady ? '▶ RUN' : 'LOADING PYTHON... ' + sec + 's';
  }
  if (!n) return;
  const sec = Math.floor((Date.now() - loadStart) / 1000);
  if (pyReady) { n.classList.add('hidden'); return; }
  if (pyFail || sec >= 25) {
    n.classList.remove('hidden');
    n.innerHTML = (pyFail
      ? 'Python could not load. ' + esc(String(pyErr).slice(0, 120)) + ' '
      : 'Python is still downloading (about 10 MB). It needs an internet connection, so this can take a while on slow data. ')
      + '<button type="button" id="btnRetry" class="underline text-cyan-300">Retry</button>';
    const r = $('btnRetry'); if (r) r.onclick = () => { if (worker) worker.terminate(); pyFail = false; pyErr = ''; startWorker(); refreshRun(); };
  } else n.classList.add('hidden');
}
setInterval(() => { if (!pyReady) refreshRun(); }, 1000);
function startWorker(){
  pyReady = false; loadStart = Date.now();
  try {
    worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type:'text/javascript' })));
    worker.onmessage = e => {
      const d = e.data;
      if (d.ready) { pyReady = true; refreshRun(); }
      else if (d.fatal) { pyFail = true; pyErr = d.fatal; refreshRun(); }
      else if (pending) { pending(d); pending = null; }
    };
    worker.onerror = e => { pyFail = true; pyErr = e.message || 'worker error'; refreshRun(); };
  } catch (e) { worker = null; pyFail = true; pyErr = String(e); refreshRun(); }
}
startWorker();
function runPy(code){
  return new Promise(res => {
    if (!worker) return res({ err:'Python is not available: ' + pyErr });
    const timer = setTimeout(() => { worker.terminate(); startWorker(); pending = null; res({ err:'TimeoutError: the code ran for more than 5 seconds. Check for an infinite loop.' }); }, 5000);
    pending = d => { clearTimeout(timer); res(d); };
    worker.postMessage(code);
  });
}
const cleanErr = m => {
  const L = m.split('\n'), k = L.findIndex(l => l.includes('<exec>'));
  return (k < 0 ? m.trim() : 'Traceback (most recent call last):\n' + L.slice(k).join('\n').trim()).replace(/<exec>/g, 'main.py');
};

/* ---------- State + rendering ---------- */
let i = 0;
const drafts = {};
const last = LESSONS.length - 1;

function goGame(){ try { localStorage.setItem(DONE_KEY, 'yes'); } catch (e) {} location.href = 'game-room.html'; }

function growEd(){ const e = $('ed'); if (!e) return; e.style.height = 'auto'; e.style.height = (e.scrollHeight + 2) + 'px'; }

function render(){
  const L = LESSONS[i];
  $('lessonCount').textContent = 'LESSON ' + (i + 1) + ' / ' + LESSONS.length;
  $('lessonTag').textContent = L.tag;
  $('steps').innerHTML = LESSONS.map((_, k) => '<div class="step ' + (k < i ? 'done' : k === i ? 'now' : '') + '"></div>').join('');

  const codes = L.code.map(c => '<pre class="code ' + c[0] + '">' + c[1] + '</pre>').join('<div class="h-2"></div>');
  const pts = L.points.map(p => '<li class="flex gap-3"><span class="text-cyan-300 font-pixel text-[9px] mt-1.5">▸</span><span>' + p + '</span></li>').join('');
  const refs = L.refs.map(r => '<li><a href="' + r[1] + '" target="_blank" rel="noopener noreferrer">' + esc(r[0]) + '</a></li>').join('');

  $('lessonBody').innerHTML =
    '<h1 class="font-pixel text-base sm:text-xl leading-snug text-[#7ae8ff]" style="text-shadow:0 0 12px rgba(122,232,255,.6)">' + L.title.toUpperCase() + '</h1>' +
    '<p class="mt-3 text-sm sm:text-base text-slate-200/90 leading-relaxed">' + L.intro + '</p>' +
    '<ul class="mt-4 space-y-2 text-sm sm:text-[15px] text-slate-300 leading-relaxed">' + pts + '</ul>' +
    '<div class="mt-5">' + codes + '</div>' +
    '<p class="mt-4 text-sm text-purple-200 leading-relaxed border-l-4 border-[#a38fc2] pl-3">' + L.note + '</p>' +

    '<div class="mt-6 border-2 border-cyan-400/30 bg-[#0b2335]/70 p-4">' +
      '<div class="flex items-center justify-between mb-2"><span class="font-pixel text-[8px] tracking-widest text-cyan-300">TRY IT YOURSELF</span><span class="tag sys">PYTHON 3</span></div>' +
      '<p class="text-sm text-slate-200 leading-relaxed mb-3">' + esc(L.tryit.task) + '</p>' +
      '<textarea id="ed" class="ed" rows="4" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Python code editor"></textarea>' +
      '<div class="mt-3 flex flex-wrap items-center gap-2">' +
        '<button id="btnRun" class="btn btn-primary pixel-btn-border" type="button">LOADING PYTHON...</button>' +
        '<button id="btnReset" class="btn btn-ghost pixel-btn-border" type="button">↺ RESET</button>' +
        '<span id="status" class="tag sys hidden"></span>' +
      '</div>' +
      '<div id="loadNote" class="hidden mt-2 text-xs text-amber-300 leading-relaxed"></div>' +
      '<div class="mt-3 font-pixel text-[8px] tracking-widest text-slate-400">OUTPUT</div>' +
      '<div id="con" class="con mt-1" aria-live="polite"><span class="ph">Press RUN to see the output here.</span></div>' +
      '<div class="mt-2 text-xs text-slate-400">Goal output: <span class="font-retro text-base text-cyan-200">' + esc(L.tryit.goal).replace(/\n/g, ' ⏎ ') + '</span></div>' +
    '</div>' +

    '<div class="mt-6 ref">' +
      '<div class="font-pixel text-[8px] tracking-widest text-cyan-300 mb-2">REFERENCES</div>' +
      '<ul class="text-sm text-slate-300 space-y-1 list-disc pl-5">' + refs + '</ul>' +
    '</div>';

  const box = $('lessonBody'); box.classList.remove('anim-pop'); void box.offsetWidth; box.classList.add('anim-pop');

  const ed = $('ed');
  ed.value = drafts[i] !== undefined ? drafts[i] : L.tryit.code; growEd();
  ed.oninput = () => { drafts[i] = ed.value; growEd(); };
  ed.onkeydown = e => {
    if (e.key === 'Tab') { e.preventDefault(); ed.setRangeText('    ', ed.selectionStart, ed.selectionEnd, 'end'); ed.oninput(); }
    e.stopPropagation(); // arrow keys stay for typing, not for changing lessons
  };
  $('btnReset').onclick = () => { ed.value = L.tryit.code; drafts[i] = L.tryit.code; growEd(); setCon(null); ed.focus(); };
  $('btnRun').onclick = runExample;
  refreshRun();

  $('btnBack').disabled = i === 0;
  $('btnNext').textContent = i === last ? '▶ START GAME' : 'NEXT ▶';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setCon(text, kind){
  const c = $('con'), st = $('status'); if (!c) return;
  c.className = 'con mt-1' + (kind ? ' ' + kind : '');
  if (text === null) { c.innerHTML = '<span class="ph">Press RUN to see the output here.</span>'; st.classList.add('hidden'); return; }
  c.textContent = text === '' ? '(no output)' : text;
}

async function runExample(){
  const L = LESSONS[i], btn = $('btnRun'), st = $('status');
  btn.disabled = true; btn.textContent = 'RUNNING...';
  const d = await runPy($('ed').value);
  const out = (d.out || '').trim();
  if (d.err) {
    setCon((out ? out + '\n' : '') + cleanErr(d.err), 'err');
    st.className = 'tag bad'; st.textContent = 'ERROR - READ THE LAST LINE';
  } else if (out === L.tryit.goal) {
    setCon(out, 'ok');
    st.className = 'tag good'; st.textContent = 'MATCHES THE GOAL';
  } else {
    setCon(out, '');
    st.className = 'tag sys'; st.textContent = 'RAN - NOT THE GOAL YET';
  }
  refreshRun();
}

$('btnBack').onclick = () => { if (i > 0) { i--; render(); } };
$('btnNext').onclick = () => { if (i < last) { i++; render(); } else goGame(); };
$('skipTop').onclick = goGame;
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') $('btnNext').click();
  else if (e.key === 'ArrowLeft' && i > 0) $('btnBack').click();
});

render();
})();
</script>
</body></html>
