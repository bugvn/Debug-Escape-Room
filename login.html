<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REMEDIATE: Login &amp; Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="sky" aria-hidden="true">
  <canvas id="starfield-canvas"></canvas>
  <div class="haze haze--teal"></div>
  <div class="haze haze--indigo"></div>
  <div class="haze haze--violet"></div>
  <div class="spark spark--1">✦</div>
  <div class="spark spark--2">★</div>
  <div class="spark spark--3">✦</div>
  <div class="spark spark--4">✦</div>
  <div class="spark spark--5">★</div>
  <div class="spark spark--6">✦</div>
  <div class="spark spark--7">★</div>
</div>

<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <div class="brand__mark">&lt;&gt;</div>
      <div>
        <span class="brand__name">Remediate</span>
        <span class="brand__slash only-wide">/</span>
        <span class="brand__sub only-wide">Python Debugging Escape Room</span>
      </div>
    </div>
    <div class="topbar__tools">
      <button class="music-btn" id="audio-toggle-btn" type="button" title="Toggle BGM" aria-label="Toggle Cosmic Lo-Fi Music">
        <svg viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-2.5-2.23l-5.5 5h-4v12h4l5.5 5v-22z"/></svg>
        <span>MUSIC ON</span>
      </button>
    </div>
  </div>
</header>

<main class="stage">
  <div class="stage__grid">
    <section class="card">
      <div class="card__corner card__corner--tl"></div>
      <div class="card__corner card__corner--tr"></div>
      <div class="card__corner card__corner--bl"></div>
      <div class="card__corner card__corner--br"></div>

      <div class="card__head">
        <h1 class="card__title" id="form-title">LOG IN TO REMEDIATE</h1>
      </div>

      <div class="tabs" id="tabs" role="tablist" aria-label="Account options">
        <button class="tab-btn" id="tab-login" role="tab" type="button" aria-selected="true">Log in</button>
        <button class="tab-btn" id="tab-create" role="tab" type="button" aria-selected="false">Create account</button>
      </div>

      <form class="form" id="escape-login-form" method="POST" action="#" novalidate>
        <div class="banner hidden" id="form-banner" role="alert">
          <span class="banner__bang">!</span>
          <p class="banner__text" id="form-banner-text"></p>
        </div>

        <p class="required-note" id="required-note"><b>*</b> = required</p>

        <button class="google-btn" id="google-signin-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          <span id="google-btn-label">CONTINUE WITH GOOGLE</span>
        </button>

        <div class="divider" id="email-divider">
          <span id="divider-text">or log in with email</span>
        </div>

        <div id="account-fields-group">
          <div class="pair" id="account-pair">
            <div id="email-col">
              <label class="label" for="account-email">ACCOUNT EMAIL <span class="star">*</span></label>
              <div class="frame" id="email-field-wrap">
                <span class="frame__prompt">&gt;</span>
                <input id="account-email" name="accountEmail" type="email" placeholder="you@example.com"
                       maxlength="50" autocomplete="email" spellcheck="false" autofocus required>
              </div>
              <p class="msg msg--err hidden" id="email-error"></p>
              <p class="msg msg--warn hidden" id="email-limit"></p>
            </div>
            <div>
              <div class="label-row">
                <label class="label" for="account-password">PASSWORD <span class="star">*</span></label>
                <button class="link-btn" id="forgot-password-btn" type="button">Forgot password?</button>
              </div>
              <div class="frame" id="password-field-wrap">
                <span class="frame__prompt">&gt;</span>
                <input id="account-password" name="accountPassword" type="password" placeholder="8+ characters"
                       minlength="8" maxlength="32" autocomplete="current-password" required>
                <button class="eye" id="toggle-password-btn" type="button" title="Show password" aria-label="Show password">👁</button>
              </div>
              <p class="msg msg--err hidden" id="password-error"></p>
              <p class="msg msg--warn hidden" id="password-limit"></p>
            </div>
          </div>
        </div>

        <div class="create-only hidden" id="create-only">
          <div>
            <div class="label-row">
              <label class="label" for="player-name">PLAYER NAME / HANDLE <span class="star">*</span></label>
              <span class="counter" id="name-count">0/20</span>
            </div>
            <div class="frame" id="name-field-wrap">
              <span class="frame__prompt">&gt;</span>
              <input id="player-name" name="playerName" type="text" placeholder="e.g. YourName99"
                     maxlength="20" autocomplete="off" spellcheck="false" aria-describedby="name-error">
            </div>
            <p class="msg msg--err hidden" id="name-error"></p>
            <p class="msg msg--warn hidden" id="name-limit"></p>
          </div>

          <div class="gap-lg">
            <span class="label" style="margin-bottom:.375rem">STARTING DIFFICULTY</span>
            <div class="levels" id="difficulty-group" role="radiogroup" aria-label="Difficulty Level Selection">
              <label class="level">
                <input class="sr-only" type="radio" name="difficulty" value="BEGINNER" checked>
                <span class="level__tile">BEGINNER</span>
              </label>
              <label class="level">
                <input class="sr-only" type="radio" name="difficulty" value="INTERMEDIATE">
                <span class="level__tile">INTERMEDIATE</span>
              </label>
              <label class="level">
                <input class="sr-only" type="radio" name="difficulty" value="ADVANCED">
                <span class="level__tile">ADVANCED</span>
              </label>
            </div>
          </div>
        </div>

        <div class="options" id="options-row">
          <div class="hidden" id="agree-wrap">
            <label class="check">
              <input class="sr-only" id="agree-rules" type="checkbox">
              <span class="check__box" id="agree-rules-box">✓</span>
              <span class="check__text">I agree to have my gameplay data recorded. <span class="star">*</span></span>
            </label>
            <p class="agree-error hidden" id="agree-error"></p>
          </div>
          <div id="remember-wrap">
            <label class="check">
              <input class="sr-only" id="remember-me" type="checkbox">
              <span class="check__box" id="remember-me-box">✓</span>
              <span class="check__text">Remember me</span>
            </label>
          </div>
        </div>

        <div>
          <button class="go-btn" id="start-game-btn" type="submit">
            <span>LOG IN</span>
            <span class="go-btn__arrow">▶</span>
          </button>
        </div>
      </form>
    </section>
  </div>
</main>

<div class="overlay hidden" id="dialog-overlay" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <div class="dialog">
    <div class="card__corner card__corner--tl"></div>
    <div class="card__corner card__corner--tr"></div>
    <div class="card__corner card__corner--bl"></div>
    <div class="card__corner card__corner--br"></div>
    <span class="dialog__tag" id="dialog-tag"></span>
    <h2 class="dialog__title" id="dialog-title"></h2>
    <p class="dialog__body" id="dialog-body"></p>
    <div class="dialog__actions" id="dialog-actions"></div>
  </div>
</div>
<div class="toast hidden" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="starfield.js"></script>
<script src="login.js"></script>
</body>
</html>
