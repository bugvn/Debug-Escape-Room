<!-- Starfield Canvas Script -->
<script data-purpose="starfield-generator">
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('starfield-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initStars();
      });

      const stars = [];
      const STAR_COUNT = 140;

      function initStars() {
        stars.length = 0;
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() > 0.85 ? 3 : (Math.random() > 0.5 ? 2 : 1),
            color: ['#ffffff', '#5ce1e6', '#b8c0ff', '#8ea7e9', '#ffd166'][Math.floor(Math.random() * 5)],
            alpha: Math.random() * 0.9 + 0.1,
            speed: Math.random() * 0.02 + 0.005,
            direction: Math.random() > 0.5 ? 1 : -1
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.alpha += s.speed * s.direction;
          if (s.alpha > 0.95 || s.alpha < 0.15) {
            s.direction *= -1;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0.1, Math.min(1, s.alpha));
          ctx.fillStyle = s.color;
          // Render crisp pixel stars
          ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
          ctx.restore();
        }

        requestAnimationFrame(draw);
      }

      initStars();
      draw();
    });

<!-- Dialog (one at a time, never stacked) and toast -->
<div aria-labelledby="dialog-title" aria-modal="true" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-space-950/80 backdrop-blur-sm" id="dialog-overlay" role="dialog">
<div class="pixel-box bg-space-850 w-full max-w-sm p-5 relative">
<div class="absolute top-1 left-1 w-2 h-2 bg-pixel-cyan"></div><div class="absolute top-1 right-1 w-2 h-2 bg-pixel-cyan"></div><div class="absolute bottom-1 left-1 w-2 h-2 bg-pixel-cyan"></div><div class="absolute bottom-1 right-1 w-2 h-2 bg-pixel-cyan"></div>
<span class="font-pixel text-[9px] uppercase tracking-widest block mb-1" id="dialog-tag"></span>
<h2 class="font-pixel text-sm text-white mb-3 leading-relaxed" id="dialog-title"></h2>
<p class="font-retro text-xl leading-snug text-slate-300 mb-5" id="dialog-body"></p>
<div class="flex flex-col-reverse sm:flex-row gap-2" id="dialog-actions"></div>
</div>
</div>
<div class="hidden fixed bottom-4 right-4 z-50 max-w-xs bg-space-850 border-2 px-3 py-2 font-mono text-xs" id="toast" role="status"></div>
<script data-purpose="ui-interactions">
document.addEventListener('DOMContentLoaded', () => {
  const $ = (id) => document.getElementById(id);
  const DEMO_EMAIL = 'demo@ue.edu.ph', DEMO_PASS = 'Debug1234'; // demo account, used to show the wrong-credentials message
  let googleSignedIn = false, mode = 'login';
  const goHome = () => { window.location.href = 'home-page.html'; };

  // ---------- Audio + password toggles ----------
  const audioBtn = $('audio-toggle-btn'); let muted = false;
  audioBtn.addEventListener('click', () => {
    muted = !muted;
    audioBtn.querySelector('span').textContent = muted ? 'MUSIC OFF' : 'MUSIC ON';
    audioBtn.classList.toggle('text-slate-500', muted);
    audioBtn.classList.toggle('text-pixel-cyan', !muted);
  });
  const pw = $('account-password'), pwBtn = $('toggle-password-btn');
  pwBtn.addEventListener('click', () => {
    const showing = pw.type === 'text';
    pw.type = showing ? 'password' : 'text';
    pwBtn.textContent = showing ? '👁' : '🙈';
    pwBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password'); pwBtn.title = showing ? 'Show password' : 'Hide password';
  });

  // ---------- Dialog + toast ----------
  const overlay = $('dialog-overlay');
  function closeDialog() { overlay.classList.add('hidden'); }
  function openDialog({ tag, color, title, body, actions }) {
    $('dialog-tag').textContent = tag; $('dialog-tag').className = 'font-pixel text-[9px] uppercase tracking-widest block mb-1 ' + color;
    $('dialog-title').textContent = title; $('dialog-body').textContent = body;
    const box = $('dialog-actions'); box.innerHTML = '';
    actions.forEach((a) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = a.label;
      b.className = 'pixel-btn-border flex-1 py-2.5 px-4 font-pixel text-[10px] uppercase tracking-wider ' +
        (a.primary ? 'bg-pixel-cyan text-space-950 font-bold hover:brightness-110' : 'bg-space-900 border border-space-600 text-slate-300 hover:border-slate-400');
      b.addEventListener('click', () => { closeDialog(); if (a.onClick) a.onClick(); });
      box.appendChild(b);
    });
    overlay.classList.remove('hidden'); box.querySelector('button').focus();
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDialog(); });
  let toastTimer;
  function toast(msg, ok = true) {
    const t = $('toast'); t.textContent = (ok ? '✓ ' : '! ') + msg;
    t.className = 'fixed bottom-4 right-4 z-50 max-w-xs bg-space-850 border-2 px-3 py-2 font-mono text-xs ' + (ok ? 'border-pixel-emerald text-pixel-emerald' : 'border-rose-400 text-rose-300');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 4000);
  }

  // ---------- Validation (each returns an error message or '') ----------
  const rules = {
    email(v) {
      v = v.trim();
      if (!v) return 'Email is required. Enter the email you registered with.';           // missing
      if (v.length > 50) return `Email is too long. Maximum is 50 characters, you entered ${v.length}.`;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'Enter a valid email, like you@school.edu.ph.'; // type
      return '';
    },
    password(v) {
      if (!v) return 'Password is required.';
      if (mode === 'login') return '';   // login only needs a password, the format rules apply when creating one
      if (v.length < 8) return `Password must be at least 8 characters. You entered ${v.length}.`; // length
      if (v.length > 32) return `Password is too long. Maximum is 32 characters, you entered ${v.length}.`;
      if (!/[A-Za-z]/.test(v) || !/\d/.test(v)) return 'Use at least one letter and one number.';   // type
      return '';
    },
    name(v) {
      v = v.trim();
      if (!v) return 'Player name is required. Pick a handle to show on your profile.';    // missing
      if (v.length < 3) return `Player name must be at least 3 characters. You entered ${v.length}.`; // length
      if (v.length > 20) return `Player name is too long. Maximum is 20 characters, you entered ${v.length}.`;
      if (!/^[A-Za-z0-9_]+$/.test(v)) return 'Use only letters, numbers, and underscores (no spaces).'; // type
      return '';
    },
    agree() { return $('agree-rules').checked ? '' : 'Please agree to data recording to continue.'; }
  };
  const fields = {
    email:    { input: $('account-email'), wrap: $('email-field-wrap'),    err: $('email-error') },
    password: { input: pw,                 wrap: $('password-field-wrap'), err: $('password-error') },
    name:     { input: $('player-name'),   wrap: $('name-field-wrap'),     err: $('name-error') },
    agree:    { input: $('agree-rules'),   wrap: $('agree-rules-box'),     err: $('agree-error') }
  };
  function check(key) {
    const f = fields[key], msg = rules[key](key === 'agree' ? '' : f.input.value);
    f.wrap.classList.toggle('field-error', !!msg);
    f.err.textContent = msg ? '⚠ ' + msg : ''; f.err.classList.toggle('hidden', !msg);
    f.input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    return !msg;
  }
  const touched = {};
  ['email', 'password', 'name'].forEach((k) => {
    fields[k].input.addEventListener('blur', () => { touched[k] = true; if (!googleSignedIn || k === 'name') check(k); });
    fields[k].input.addEventListener('input', () => { if (touched[k]) check(k); $('form-banner').classList.add('hidden'); });
  });
  fields.agree.input.addEventListener('change', () => { if (touched.agree) check('agree'); });
  fields.name.input.addEventListener('input', () => { $('name-count').textContent = fields.name.input.value.length + '/20'; });

  // ---------- Live max-length notice ----------
  const MAX = { email: 50, password: 32, name: 20 }, LABEL = { email: 'Email', password: 'Password', name: 'Player name' };
  function limitNotice(k) {
    const at = fields[k].input.value.length >= MAX[k], el = $(k + '-limit');
    el.textContent = at ? `Maximum of ${MAX[k]} characters reached.` : '';
    el.classList.toggle('hidden', !at);
    if (k === 'name') { $('name-count').classList.toggle('text-pixel-amber', at); $('name-count').classList.toggle('text-slate-400', !at); }
  }
  ['email', 'password', 'name'].forEach((k) => fields[k].input.addEventListener('input', () => limitNotice(k)));

  // ---------- Google sign-in (placeholder) ----------
  const gBtn = $('google-signin-btn');
  gBtn.addEventListener('click', () => {
    if (mode === 'login') {
      openDialog({ tag: 'Logged in', color: 'text-pixel-emerald', title: 'WELCOME BACK!', body: 'You are signed in with Google. Your progress and mistake history are loaded.',
        actions: [{ label: 'Start playing', primary: true, onClick: goHome }] });
      return;
    }
    googleSignedIn = true;
    gBtn.disabled = true;
    gBtn.classList.remove('bg-space-900', 'border-space-600', 'hover:border-slate-400', 'text-slate-300');
    gBtn.classList.add('bg-space-950', 'border-emerald-500/60', 'text-emerald-400', 'cursor-default', 'opacity-80');
    $('google-icon').classList.add('grayscale', 'opacity-60');
    $('google-btn-label').textContent = '✓ SIGNED IN WITH GOOGLE';
    ['email', 'password'].forEach((k) => { fields[k].input.disabled = true; check_clear(k); });
    pwBtn.disabled = true;
    $('account-fields-group').classList.add('opacity-40', 'pointer-events-none');
    $('email-divider').classList.add('hidden'); $('forgot-password-btn').classList.add('hidden');
    toast('Signed in with Google. Finish your player setup below.');
    fields.name.input.focus();
  });
  function check_clear(k) { fields[k].wrap.classList.remove('field-error'); fields[k].err.classList.add('hidden'); }

  // ---------- Forgot password (confirmation dialog) ----------
  $('forgot-password-btn').addEventListener('click', () => {
    if (!check('email')) { fields.email.input.focus(); return; }
    const email = fields.email.input.value.trim();
    openDialog({
      tag: 'Reset password', color: 'text-pixel-amber', title: 'SEND RESET LINK?',
      body: `We will send a password reset link to ${email}.`,
      actions: [
        { label: 'Cancel' },
        { label: 'Send link', primary: true, onClick: () => toast(`Reset link sent to ${email}. Check your inbox.`) }
      ]
    });
  });

  // ---------- Log in / Create account tabs ----------
  const COPY = {
    login:  { tag: 'Welcome back', title: 'LOG IN TO REMEDIATE',  divider: 'or log in with email',  btn: 'LOG IN',         pw: 'current-password' },
    create: { tag: 'New player',   title: 'CREATE YOUR ACCOUNT',  divider: 'or sign up with email', btn: 'CREATE ACCOUNT', pw: 'new-password' }
  };
  gBtn.dataset.cls = gBtn.className;
  function resetGoogle() {
    if (!googleSignedIn) return;
    googleSignedIn = false; gBtn.disabled = false; gBtn.className = gBtn.dataset.cls;
    $('google-icon').classList.remove('grayscale', 'opacity-60'); $('google-btn-label').textContent = 'CONTINUE WITH GOOGLE';
    ['email', 'password'].forEach((k) => { fields[k].input.disabled = false; });
    pwBtn.disabled = false; $('account-fields-group').classList.remove('opacity-40', 'pointer-events-none'); $('email-divider').classList.remove('hidden');
  }
  function setMode(m) {
    resetGoogle(); mode = m; const c = COPY[m];
    $('tab-login').setAttribute('aria-selected', m === 'login'); $('tab-create').setAttribute('aria-selected', m === 'create');
    $('form-title').textContent = c.title; $('divider-text').textContent = c.divider;
    $('start-game-btn').querySelector('span').textContent = c.btn;
    $('create-only').classList.toggle('hidden', m === 'login'); $('agree-wrap').classList.toggle('hidden', m === 'login');
    $('forgot-password-btn').classList.toggle('hidden', m === 'create'); $('remember-wrap').classList.toggle('hidden', m === 'create');
    pw.setAttribute('autocomplete', c.pw); $('form-banner').classList.add('hidden');
    Object.values(fields).forEach((f) => { f.wrap.classList.remove('field-error'); f.err.classList.add('hidden'); f.input.setAttribute('aria-invalid', 'false'); });
    Object.keys(touched).forEach((k) => delete touched[k]);
  }
  $('tab-login').addEventListener('click', () => setMode('login'));
  $('tab-create').addEventListener('click', () => setMode('create'));

  // ---------- Submit ----------
  $('escape-login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    touched.email = touched.password = touched.name = touched.agree = true;
    const keys = mode === 'login' ? ['email', 'password'] : (googleSignedIn ? ['name', 'agree'] : ['email', 'password', 'name', 'agree']);
    const results = keys.map((k) => [k, check(k)]);           // run every check so all errors show at once
    const firstBad = results.find(([, ok]) => !ok);
    const banner = $('form-banner'), bannerText = $('form-banner-text');
    if (firstBad) {
      const n = results.filter(([, ok]) => !ok).length;
      bannerText.textContent = `${n} ${n === 1 ? 'field needs' : 'fields need'} your attention. Fix the highlighted ${n === 1 ? 'field' : 'fields'} and try again.`;
      banner.classList.remove('hidden');
      fields[firstBad[0]].input.focus();
      return;
    }
    banner.classList.add('hidden');

    const btn = $('start-game-btn'), original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="animate-spin text-sm">◆</span><span>CHECKING ACCOUNT...</span>';
    setTimeout(() => {
      btn.innerHTML = original; btn.disabled = false;
      const email = fields.email.input.value.trim().toLowerCase();
      if (mode === 'login') {
        if (email === DEMO_EMAIL && pw.value !== DEMO_PASS) {
          bannerText.textContent = 'Email or password is incorrect. Check both and try again, or select Forgot password? to reset it.';
          banner.classList.remove('hidden');
          fields.password.wrap.classList.add('field-error'); pw.value = ''; pw.focus();
          return;
        }
        openDialog({ tag: 'Logged in', color: 'text-pixel-emerald', title: 'WELCOME BACK!', body: 'Your progress and mistake history are loaded.',
          actions: [{ label: 'Start playing', primary: true, onClick: goHome }] });
        return;
      }
      if (!googleSignedIn && email === DEMO_EMAIL) {
        bannerText.textContent = 'An account with this email already exists. Select Log in, or use a different email.';
        banner.classList.remove('hidden'); fields.email.wrap.classList.add('field-error'); fields.email.input.focus();
        return;
      }
      const diff = document.querySelector('input[name="difficulty"]:checked').value;
      openDialog({
        tag: 'Account ready', color: 'text-pixel-emerald', title: 'WELCOME, ' + fields.name.input.value.trim().toUpperCase() + '!',
        body: `Your account is ready. Starting difficulty: ${diff.charAt(0) + diff.slice(1).toLowerCase()}. Your mistake history will be saved to your account.`,
        actions: [{ label: 'Start playing', primary: true, onClick: goHome }]
      });
    }, 900);
  });
});
</script>
