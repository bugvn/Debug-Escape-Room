<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REMEDIATE: Debug Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/test-summary.css">
</head>
<body>

<div class="scanlines"></div>
<div class="glow glow--cyan"></div>
<div class="glow glow--violet"></div>

<header id="siteHeader" data-title="Debug Report" data-actions="settings"></header>
<script src="js/site-header.js"></script>

<div class="page">

  <main class="board">

    <div class="board__left">
      <div class="summary pixel-box">
        <div class="rule"></div>

        <div class="score">
          <div class="score__inner">
            <div class="score__halo score__halo--r"></div>
            <div class="score__halo score__halo--l"></div>
            <div class="score__head">
              <p class="score__kicker">Evaluation Report</p>
              <p class="score__word score__word--top">FINAL</p>
              <div class="score__num" id="scoreVal">--</div>
              <p class="score__word">SCORE</p>
            </div>

            <div class="rank">
              <div class="rank__body">
                <span class="rank__letter" id="rankLetter">-</span>
                <div>
                  <p class="rank__title" id="rankTitle">LOADING...</p>
                  <p class="rank__sub" id="rankSub"></p>
                </div>
              </div>
            </div>

            <div class="stats">
              <div class="stat">
                <div class="stat__label">TIME TAKEN</div>
                <div class="stat__value stat__value--peach" id="timeVal">--</div>
                <div class="stat__sub stat__sub--green" id="timeSub"></div>
              </div>
              <div class="stat">
                <div class="stat__label">ACCURACY</div>
                <div class="stat__value stat__value--cyan" id="accVal">--</div>
                <div class="stat__sub stat__sub--violet" id="accSub"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="rule"></div>

        <div class="patterns">
          <p class="patterns__title">Mistake Pattern Log</p>
          <div id="mistakeList"></div>
        </div>
      </div>
    </div>

    <div class="board__right">

      <section class="panel panel--errors pixel-box">
        <div class="panel__head">
          <div class="panel__name">
            <span class="panel__square"></span>
            <h3 class="panel__heading">COMMON MISTAKES</h3>
          </div>
          <span class="panel__count" id="errCount">0 FOUND</span>
        </div>
        <div class="panel__list" id="errList"></div>
      </section>

      <section class="panel panel--recs pixel-box">
        <div class="panel__head">
          <div class="panel__name">
            <span class="panel__square"></span>
            <h3 class="panel__heading">RECOMMENDATIONS</h3>
          </div>
          <span class="panel__count" id="recCount">0 SUGGESTIONS</span>
        </div>
        <div class="panel__list" id="recList"></div>
      </section>

    </div>
  </main>

  <div class="actions">
    <div class="actions__row">
      <button class="act act--go" onclick="location.href='game-room.html'">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M2 1 L11 6 L2 11 Z"/></svg> PLAY AGAIN
      </button>
      <button class="act act--menu" onclick="location.href='dashboard.html'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg> DASHBOARD
      </button>
      <button class="act act--share" id="shareBtn" type="button" disabled>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M6 1 L11 8 L1 8 Z"/></svg> <span id="shareLabel">SHARE SCORE</span>
      </button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/score.js"></script>
<script src="js/ambient-music.js"></script>
<script src="js/shared-settings.js"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const mmss = sec => Math.floor(sec/60) + 'm ' + String(sec%60).padStart(2,'0') + 's';
  const u = await requireLogin(); if (!u) return;
  const p = await getProfile(u.id);
  if (p) $('playerName').textContent = p.player_name;

  // what each mistake tag means for the player: category + what to practise.
  // Tags are the Python error names the game saves (see evaluate() in game-room.html).
  const SYNTAX = { cat: 'Syntax', rec: 'Check Python Syntax', text: 'Look for a missing colon, bracket, quote or wrong indentation. The error message points at the line.' };
  const INFO = {
    IndexError:    { cat: 'Index out of range', rec: 'Practice Loop Boundaries', text: 'A list of n items has indexes 0 to n-1. Count how many times your loop runs and compare it to the list length.' },
    TypeError:     { cat: 'Mixed data types', rec: 'Check Data Types', text: 'A string and a number cannot be added. Convert with int() or str() first, and check the quotes around values.' },
    NameError:     { cat: 'Variable scope', rec: 'Review Variable Scope', text: 'A variable made inside a function is not visible outside it. Return the value and store it in a variable.' },
    UnboundLocalError: { cat: 'Variable scope', rec: 'Review Variable Scope', text: 'A variable made inside a function is not visible outside it. Return the value and store it in a variable.' },
    RecursionError:{ cat: 'Recursion', rec: 'Give Recursion a Stopping Point', text: 'Every recursive call must move closer to the base case, or the calls never stop.' },
    SyntaxError:   SYNTAX, IndentationError: SYNTAX,
    'Infinite Loop':    { cat: 'Infinite loop', rec: 'Make Loops Finish', text: 'Check that the loop condition can become false, and that the variable it depends on changes every round.' },
    'Wrong Output':     { cat: 'Wrong output', rec: 'Compare With the Expected Output', text: 'Your code ran but printed something else. Trace it by hand with the mission values.' },
    'Hardcoded Answer': { cat: 'Hardcoded answer', rec: 'Fix the Cause, Not the Result', text: 'Typing the answer in only works for one case. Keep the original logic and repair the actual bug.' }
  };
  const info = k => INFO[k] || { cat: k, rec: 'Read the Last Line of the Error', text: 'The last line of a Python error names the problem. Start there.' };

  const sid = sessionStorage.getItem('lastSessionId');
  let q = db.from('game_sessions').select('*');
  q = sid ? q.eq('id', sid) : q.order('created_at', { ascending: false });
  const { data: sess } = await q.limit(1);
  const s = sess && sess[0];
  if (!s) {
    $('rankTitle').textContent = 'NO GAME DATA';
    $('rankSub').textContent = 'Play a room first';
    $('mistakeList').innerHTML = '<p class="empty-note">Nothing logged yet.</p>';
    return;
  }
  const { data: subsRaw } = await db.from('submissions').select('*').eq('session_id', s.id);
  const subs = subsRaw || [];
  // this game's number = how many games the player started up to and including this one
  const { count: attempts } = await db.from('game_sessions').select('id', { count: 'exact', head: true }).lte('created_at', s.created_at);

  const subm = submitsOf(subs);   // accuracy counts submits only, not test runs
  const total = subm.length, good = subm.filter(x => x.is_correct).length;
  const PAR = PAR_SEC;
  const score = scoreOf(s, subs);
  const r = rankOf(score);

  $('scoreVal').textContent = score;
  $('rankLetter').textContent = r[1];
  $('rankTitle').textContent = 'RANK ' + r[1] + ' - ' + r[2];
  $('rankSub').textContent = 'Attempt #' + (attempts || 1) + ' · ' + ({won:'Escaped', left:'Left room', in_progress:'Unfinished'}[s.result] || s.result);
  $('timeVal').textContent = mmss(s.elapsed_sec);
  $('timeSub').textContent = 'Par ' + mmss(PAR);
  $('accVal').textContent = total ? Math.round(100 * good / total) + '%' : '--';
  $('accSub').textContent = total ? good + ' / ' + total + ' Submits Correct' : 'No submissions';

  const tags = {}, where = {};
  subs.filter(x => !x.is_correct).forEach(x => {
    const k = x.mistake_tag || 'Other';
    tags[k] = (tags[k] || 0) + 1;
    (where[k] = where[k] || new Set()).add(x.puzzle);
  });
  const keys = Object.keys(tags).sort((a, b) => tags[b] - tags[a]), max = Math.max(3, ...keys.map(k => tags[k]));
  $('mistakeList').innerHTML = keys.length ? keys.map(k => `
    <div>
      <div class="pattern__head">
        <span class="pattern__name">${esc(k)}</span>
        <span class="pattern__hits">${tags[k]} ${tags[k] === 1 ? 'HIT' : 'HITS'}</span>
      </div>
      <div class="pattern__track"><div class="pattern__fill" style="width:${Math.round(100 * tags[k] / max)}%"></div></div>
    </div>`).join('') : '<p class="empty-note">No mistakes logged. Clean run.</p>';

  // ACCURACY BY CATEGORY: from the category saved with every attempt (js/puzzles.js / puzzles.json). Old games without it skip this.
  const byCat = {};
  subm.filter(x => x.category).forEach(x => { const c = byCat[x.category] = byCat[x.category] || { n: 0, ok: 0 }; c.n++; if (x.is_correct) c.ok++; });
  const cats = Object.keys(byCat);
  if (cats.length) $('mistakeList').innerHTML += '<p class="patterns__title" style="margin-top:14px">Accuracy by Category</p>' + cats.map(c => `
    <div>
      <div class="pattern__head">
        <span class="pattern__name">${esc(c)}</span>
        <span class="pattern__hits">${byCat[c].ok} / ${byCat[c].n} SUBMITS</span>
      </div>
      <div class="pattern__track"><div class="pattern__fill" style="width:${Math.round(100 * byCat[c].ok / byCat[c].n)}%"></div></div>
    </div>`).join('');

  // COMMON MISTAKES + RECOMMENDATIONS: built from this game's real mistake tags (top 3)
  const top = keys.slice(0, 3), hl = ['hl-peach', 'hl-cyan', 'hl-violet'];
  const num = i => String(i + 1).padStart(2, '0');
  $('errCount').textContent = top.length + ' FOUND';
  $('errList').innerHTML = top.length ? top.map((k, i) => `
    <div class="entry entry--err"><div class="entry__row">
      <span class="entry__tag">ERR #${num(i)}</span>
      <div><h4 class="entry__title">${esc(info(k).cat)}</h4>
      <p class="entry__text"><span class="${hl[i]}">${esc(k)}</span> x${tags[k]} in ${[...where[k]].map(esc).join(', ')}.</p></div>
    </div></div>`).join('') : '<div class="entry entry--err"><div class="entry__row"><span class="entry__tag">ERR #00</span><div><h4 class="entry__title">No mistakes found</h4><p class="entry__text">Every test run and submit in this game passed.</p></div></div></div>';
  const recs = [], seen = new Set();
  top.forEach(k => { const r = info(k); if (!seen.has(r.rec)) { seen.add(r.rec); recs.push(r); } });
  if (!recs.length) recs.push({ rec: 'Try a Harder Challenge', text: 'A clean run. Next time, try to finish faster or with fewer hints.' });
  if (s.hints_used >= 3) recs.push({ rec: 'Try Fewer Hints', text: 'You used all 3 hints. Read the error message and trace the code by hand before asking.' });
  $('recCount').textContent = recs.length + (recs.length === 1 ? ' SUGGESTION' : ' SUGGESTIONS');
  $('recList').innerHTML = recs.map((r, i) => `
    <div class="entry entry--rec"><div class="entry__row">
      <span class="entry__tag">REC #${num(i)}</span>
      <div><h4 class="entry__title">${esc(r.rec)}</h4><p class="entry__text">${esc(r.text)}</p></div>
    </div></div>`).join('');

  // SHARE SCORE: native share sheet when the device has one, else copy the text
  const shareText = `I scored ${score}/100 (Rank ${r[1]}, ${r[2]}) in Remediate: ${good}/${total} submits correct, ${s.solved_count}/4 puzzles, ${mmss(s.elapsed_sec)}.`;
  const sb = $('shareBtn'); sb.disabled = false;
  sb.onclick = async () => {
    try {
      if (navigator.share) await navigator.share({ title: 'Remediate score', text: shareText });
      else { await navigator.clipboard.writeText(shareText); $('shareLabel').textContent = 'COPIED!'; setTimeout(() => { $('shareLabel').textContent = 'SHARE SCORE'; }, 2000); }
    } catch (e) { if (e.name !== 'AbortError') { $('shareLabel').textContent = 'COPY FAILED'; setTimeout(() => { $('shareLabel').textContent = 'SHARE SCORE'; }, 2000); } }
  };
})();
</script>
</body></html>
